<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020611">
  <title>Carte La Bétaillère — France LIVE</title>
  <link rel="preconnect" href="https://vps.labetaillere.fr" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{color-scheme:dark;--bg:#020611;--panel:rgba(2,10,24,.96);--cyan:#00eaff;--blue:#168dff;--violet:#7457e8;--pink:#e83e8c;--orange:#ffad32;--green:#9cff00;--red:#ff405c;--text:#edfaff;--muted:#8ca8c5}
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}html,body{overflow:hidden;background:var(--bg)}body{font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    #map{position:absolute;inset:0;background:#06101c}.leaflet-container{background:#06101c}
    body.mode-faded .leaflet-tile-pane img{filter:saturate(.48) brightness(.72) contrast(.86);opacity:.66}
    body.mode-bw .leaflet-tile-pane img{filter:grayscale(1) brightness(.62) contrast(1.05);opacity:.72}
    body.mode-sat-faded .leaflet-tile-pane img{filter:saturate(.58) brightness(.68) contrast(.9);opacity:.7}
    .toolbar{position:fixed;z-index:1000;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:6px;min-height:36px;padding:5px 7px;border:1px solid rgba(0,234,255,.3);border-radius:10px;background:linear-gradient(135deg,rgba(2,9,22,.96),rgba(4,20,38,.93));box-shadow:0 8px 24px rgba(0,0,0,.34);backdrop-filter:blur(8px)}
    .brand{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto}.brand-cow{font-size:15px;line-height:1}.brand-title{font:850 10px/1 Orbitron,Rajdhani,system-ui,sans-serif;letter-spacing:.045em;white-space:nowrap}.status{font:750 9px/1 Rajdhani,system-ui,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:260px}
    .controls{display:flex;align-items:center;gap:4px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}
    .pill,.mini-select,.time-input{height:27px;flex:0 0 auto;border:1px solid rgba(0,234,255,.22);border-radius:7px;background:rgba(4,20,38,.9);color:#eaffff;font:800 9px/1 Rajdhani,system-ui,sans-serif}.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;cursor:pointer}.pill.is-active{border-color:rgba(0,234,255,.72);background:rgba(0,109,143,.27);color:#fff}.pill.ter.is-active{border-color:#00a9c7}.pill.tgv.is-active{border-color:#7457e8}.pill.cfl.is-active{border-color:#e83e8c}.mini-select{padding:0 5px;max-width:92px}.time-input{width:68px;padding:0 4px;color-scheme:dark}
    .train-icon{background:transparent!important;border:0!important}.train-marker{display:inline-flex;align-items:center;gap:2px;transform:translate(-50%,-50%);white-space:nowrap;will-change:transform}.train-marker .cow{font-size:8px;opacity:.9}.train-marker .num{display:inline-flex;align-items:center;min-height:16px;padding:1px 4px;border:1px solid currentColor;border-radius:4px;background:rgba(2,10,22,.94);font:900 9px/1 Rajdhani,system-ui,sans-serif;box-shadow:0 2px 4px rgba(0,0,0,.25)}.train-marker.ter{color:#42b8ff}.train-marker.tgv{color:#dfb3ff}.train-marker.cfl{color:#ff8abc}.train-marker.other{color:#9cff00}.train-marker .delay{display:inline-flex;align-items:center;min-height:15px;padding:1px 3px;border-radius:4px;background:rgba(73,42,0,.95);color:var(--orange);font:900 8px/1 Rajdhani,system-ui,sans-serif}.train-marker.is-selected{opacity:1!important}.train-marker.is-dim{opacity:.2}
    .detail{position:fixed;z-index:1050;top:49px;right:7px;width:min(390px,calc(100vw - 14px));max-height:calc(100dvh - 57px);display:flex;flex-direction:column;overflow:hidden;padding:10px;border:1px solid rgba(0,234,255,.36);border-radius:13px;background:linear-gradient(150deg,rgba(2,9,22,.985),rgba(4,19,37,.97));box-shadow:0 14px 36px rgba(0,0,0,.46);backdrop-filter:blur(9px)}.detail[hidden]{display:none}.detail-head{display:flex;align-items:flex-start;gap:8px;flex:0 0 auto;padding-bottom:7px;border-bottom:1px solid rgba(0,234,255,.17)}.detail-title{min-width:0;flex:1}.detail-title strong{display:block;color:#f4fdff;font:900 14px/1.1 Rajdhani,system-ui,sans-serif}.detail-title span{display:block;margin-top:3px;color:var(--muted);font:700 10px/1.2 Rajdhani,system-ui,sans-serif;overflow-wrap:anywhere}.detail-delay{color:var(--orange)!important;font-weight:900!important}.icon-btn{width:28px;height:28px;flex:0 0 28px;border:1px solid rgba(0,234,255,.24);border-radius:7px;background:rgba(3,21,39,.9);color:#effcff;font-size:18px;line-height:1;cursor:pointer}.detail-actions{display:flex;gap:5px;flex:0 0 auto;padding:7px 0 2px}.detail-actions button{height:27px;padding:0 8px;border:1px solid rgba(0,234,255,.23);border-radius:7px;background:rgba(3,21,39,.9);color:#dffaff;font:800 9px/1 Rajdhani,system-ui,sans-serif;cursor:pointer}.stops{list-style:none;margin:5px 0 0;padding:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.stops li{display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center;min-height:27px;padding:4px 2px;border-bottom:1px solid rgba(0,234,255,.08);font-size:10px}.stop-time{color:#88eaff;font-variant-numeric:tabular-nums;font-weight:850}.stop-name{min-width:0;overflow-wrap:anywhere}
    .loading-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 7px rgba(0,234,255,.7)}
    .leaflet-control-zoom{border:1px solid rgba(0,234,255,.25)!important;border-radius:8px!important;overflow:hidden!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(2,10,24,.94)!important;color:#eaffff!important;border-color:rgba(0,234,255,.15)!important}
    .leaflet-tooltip.stop-tip{border:1px solid rgba(0,234,255,.35)!important;border-radius:6px!important;background:rgba(2,10,22,.95)!important;color:#effcff!important;box-shadow:none!important;font:800 9px/1.1 Rajdhani,system-ui,sans-serif!important;padding:3px 5px!important}.leaflet-tooltip.stop-tip::before{display:none!important}
    @media(max-width:720px){.toolbar{top:5px;left:5px;right:5px;padding:4px 5px;gap:4px;min-height:33px}.brand-title{font-size:9px}.status{font-size:8px;max-width:120px}.brand-cow{font-size:13px}.pill,.mini-select,.time-input{height:25px;font-size:8px}.pill{padding:0 6px}.mini-select{max-width:70px}.time-input{width:61px}.train-marker .cow{font-size:8px}.train-marker .num{min-height:14px;padding:1px 3px;font-size:8px}.train-marker .delay{min-height:13px;font-size:7px}.detail{top:auto;left:5px;right:5px;bottom:5px;width:auto;max-height:48dvh;padding:8px;border-radius:12px}.detail-title strong{font-size:13px}.stops li{min-height:25px;font-size:9.5px}.leaflet-bottom{transition:none}body.has-detail .leaflet-bottom{bottom:48dvh}}
    @media(max-width:430px){.status{display:none}.brand-title{font-size:8.5px}.pill .wide{display:none}.controls{gap:3px}.pill{padding:0 5px}.mini-select{max-width:64px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div id="map" aria-label="Carte ferroviaire France en direct"></div>
  <div class="toolbar" data-lb-map-ui>
    <div class="brand"><span class="brand-cow">🐄</span><span class="brand-title">FRANCE LIVE</span><span class="loading-dot" id="liveDot" aria-hidden="true"></span></div>
    <div class="status" id="status">Préparation…</div>
    <div class="controls" aria-label="Contrôles de carte">
      <button class="pill ter is-active" data-filter="ter" type="button">TER</button>
      <button class="pill tgv is-active" data-filter="tgv" type="button">TGV</button>
      <button class="pill cfl is-active" data-filter="cfl" type="button">CFL</button>
      <button class="pill" id="franceBtn" type="button"><span class="wide">France</span>⌖</button>
      <select class="mini-select" id="baseMap" aria-label="Fond de carte">
        <option value="standard">Plan</option><option value="faded">Épuré</option><option value="bw">N&B</option><option value="satellite">Satellite</option><option value="sat-faded">Sat. épuré</option>
      </select>
      <input class="time-input" id="mapTime" type="time" step="60" aria-label="Heure affichée">
      <button class="pill is-active" id="liveBtn" type="button">LIVE</button>
    </div>
  </div>

  <aside class="detail" id="detail" hidden aria-live="polite">
    <div class="detail-head"><div class="detail-title"><strong id="detailTitle"></strong><span id="detailMeta"></span><span id="detailDelay" class="detail-delay"></span></div><button class="icon-btn" id="closeDetail" type="button" aria-label="Fermer">×</button></div>
    <div class="detail-actions"><button id="fitRouteBtn" type="button">Voir tout le parcours</button></div>
    <ol class="stops" id="stops"></ol>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{
    'use strict';
    const API='https://vps.labetaillere.fr';
    const CACHE_KEY='lb-map-france-trains-v1';
    const FRANCE_BOUNDS=L.latLngBounds([[41.0,-5.6],[51.5,9.8]]);
    const filters={ter:true,tgv:true,cfl:true};
    const markerEntries=new Map(),tripCache=new Map(),pathCache=new Map(),infraCache=new Map();
    let latestTrains=[],trainAbort=null,infraAbort=null,trainSerial=0,infraSerial=0,trainTimer=null,infraTimer=null,realtimeTimer=null,selectedTime=null,selectedTrain=null,selectedPathLayer=null,lastRenderMode='dot',baseLayer=null;

    const statusEl=document.getElementById('status'),detailEl=document.getElementById('detail'),detailTitleEl=document.getElementById('detailTitle'),detailMetaEl=document.getElementById('detailMeta'),detailDelayEl=document.getElementById('detailDelay'),stopsEl=document.getElementById('stops'),timeEl=document.getElementById('mapTime'),liveBtn=document.getElementById('liveBtn'),baseMapEl=document.getElementById('baseMap');

    const map=L.map('map',{preferCanvas:true,zoomControl:false,attributionControl:false,fadeAnimation:false,zoomAnimation:true,markerZoomAnimation:false});
    map.fitBounds(FRANCE_BOUNDS,{padding:[8,8]});
    L.control.zoom({position:'bottomleft'}).addTo(map);
    L.control.attribution({position:'bottomright',prefix:false}).addTo(map).addAttribution('© OpenStreetMap · SNCF Réseau');

    const tiles={
      standard:()=>L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,keepBuffer:2}),
      faded:()=>L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,keepBuffer:2}),
      bw:()=>L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,keepBuffer:2}),
      satellite:()=>L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,updateWhenIdle:true,keepBuffer:2}),
      'sat-faded':()=>L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,updateWhenIdle:true,keepBuffer:2})
    };
    const infrastructureLayer=L.geoJSON(null,{renderer:L.canvas({padding:.35}),interactive:false,style:infraStyle}).addTo(map),trainLayer=L.layerGroup().addTo(map),selectedStopsLayer=L.layerGroup().addTo(map);

    function setBaseMap(mode){if(!tiles[mode])mode='standard';if(baseLayer)map.removeLayer(baseLayer);document.body.classList.remove('mode-faded','mode-bw','mode-sat-faded');if(mode==='faded')document.body.classList.add('mode-faded');if(mode==='bw')document.body.classList.add('mode-bw');if(mode==='sat-faded')document.body.classList.add('mode-sat-faded');baseLayer=tiles[mode]().addTo(map);baseLayer.bringToBack();try{localStorage.setItem('lb-map-basemap',mode)}catch(_){}}
    function infraStyle(feature){const p=feature?.properties||{},kind=String(p.kind||'classic').toLowerCase(),source=String(p.source||'').toUpperCase();if(source==='CFL')return{color:'#e83e8c',weight:2.5,opacity:.82};if(kind==='lgv')return{color:'#7457e8',weight:3,opacity:.9};if(kind==='connector')return{color:'#ff9f1c',weight:2.1,opacity:.9,dashArray:'5 5'};if(kind==='closed')return{color:'#727b86',weight:1.1,opacity:.42,dashArray:'4 5'};return{color:'#00a9c7',weight:1.9,opacity:.68}}
    function categoryColor(cat){return cat==='cfl'?'#e83e8c':cat==='tgv'?'#7457e8':cat==='ter'?'#00a9c7':'#9cff00'}
    function localTimeValue(date=new Date()){return`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`}
    function selectedAtParameter(){if(!selectedTime)return'';const now=new Date(),[h,m]=selectedTime.split(':').map(Number),y=now.getFullYear(),mo=String(now.getMonth()+1).padStart(2,'0'),d=String(now.getDate()).padStart(2,'0');return`&at=${y}-${mo}-${d}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`}
    function bboxString(){const b=map.getBounds();return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(v=>v.toFixed(5)).join(',')}
    function bboxArray(){const b=map.getBounds();return[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]}
    function renderMode(){return map.getZoom()<7?'dot':'label'}
    function delayMinutes(train){return Math.round(Number(train.delaySeconds||0)/60)}
    function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
    async function getJson(url,{signal}={}){const response=await fetch(url,{headers:{Accept:'application/json'},signal,cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);return response.json()}

    function normalCategory(train){const cat=String(train.category||'other').toLowerCase();return['ter','tgv','cfl'].includes(cat)?cat:'other'}
    function labelIcon(train){const delay=delayMinutes(train),cat=normalCategory(train),delayHtml=delay?`<span class="delay">${delay>0?'+':''}${delay}</span>`:'';return L.divIcon({className:'train-icon',html:`<span class="train-marker ${cat}" data-trip="${escapeHtml(train.tripId)}"><span class="cow">🐄</span><span class="num">${escapeHtml(train.label||train.number||'Train')}</span>${delayHtml}</span>`,iconSize:[1,1],iconAnchor:[0,0]})}
    function makeMarker(train,mode){if(mode==='dot'){const color=categoryColor(normalCategory(train));return L.circleMarker([train.lat,train.lon],{radius:3.1,color,weight:1.3,fillColor:color,fillOpacity:.8,opacity:.92,bubblingMouseEvents:false})}return L.marker([train.lat,train.lon],{icon:labelIcon(train),keyboard:false,riseOnHover:true,bubblingMouseEvents:false})}
    function markerSignature(train,mode){return`${mode}|${normalCategory(train)}|${train.label||train.number||''}|${delayMinutes(train)}`}
    function markerEnabled(train){const cat=normalCategory(train);return cat==='other'||filters[cat]!==false}
    function attachTrainClick(marker,train){marker.off('click');marker.on('click',e=>{L.DomEvent.stopPropagation(e);selectTrain(train).catch(showError)})}

    function updateMarkers(trains,{fromCache=false,requestMs=null}={}){
      latestTrains=Array.isArray(trains)?trains:[];const mode=renderMode(),seen=new Set();
      if(mode!==lastRenderMode){trainLayer.clearLayers();markerEntries.clear();lastRenderMode=mode}
      for(const train of latestTrains){if(!train||!train.tripId||!Number.isFinite(Number(train.lat))||!Number.isFinite(Number(train.lon)))continue;seen.add(train.tripId);const sig=markerSignature(train,mode);let entry=markerEntries.get(train.tripId);if(!entry||entry.signature!==sig){if(entry?.marker)trainLayer.removeLayer(entry.marker);const marker=makeMarker(train,mode);entry={marker,signature:sig,train,visible:false};markerEntries.set(train.tripId,entry);attachTrainClick(marker,train)}else{entry.train=train;entry.marker.setLatLng([train.lat,train.lon]);attachTrainClick(entry.marker,train)}const shouldShow=markerEnabled(train);if(shouldShow&&!entry.visible){trainLayer.addLayer(entry.marker);entry.visible=true}if(!shouldShow&&entry.visible){trainLayer.removeLayer(entry.marker);entry.visible=false}}
      for(const[id,entry]of markerEntries){if(!seen.has(id)){if(entry.visible)trainLayer.removeLayer(entry.marker);markerEntries.delete(id)}}applySelectionDimming();const shown=latestTrains.filter(markerEnabled).length,stamp=selectedTime||localTimeValue(),perf=requestMs!=null?` · ${Math.round(requestMs)} ms`:'';statusEl.textContent=`${shown} trains · ${stamp}${fromCache?' · cache':''}${perf}`
    }
    function applyFilters(){for(const entry of markerEntries.values()){const shouldShow=markerEnabled(entry.train);if(shouldShow&&!entry.visible){trainLayer.addLayer(entry.marker);entry.visible=true}if(!shouldShow&&entry.visible){trainLayer.removeLayer(entry.marker);entry.visible=false}}applySelectionDimming();statusEl.textContent=`${latestTrains.filter(markerEnabled).length} trains · ${selectedTime||localTimeValue()}`}
    function applySelectionDimming(){const selectedId=selectedTrain?.tripId||null;for(const[id,entry]of markerEntries){const dim=!!selectedId&&id!==selectedId;if(entry.marker instanceof L.CircleMarker){const color=categoryColor(normalCategory(entry.train));entry.marker.setStyle({color,fillColor:color,opacity:dim?.18:.92,fillOpacity:dim?.12:.8})}else{const el=entry.marker.getElement()?.querySelector('.train-marker');if(el){el.classList.toggle('is-dim',dim);el.classList.toggle('is-selected',id===selectedId)}}}}

    function loadCachedSnapshot(){try{const raw=sessionStorage.getItem(CACHE_KEY);if(!raw)return false;const cached=JSON.parse(raw);if(!cached||Date.now()-cached.savedAt>120000||!Array.isArray(cached.data?.trains))return false;const center=map.getCenter(),b=cached.bounds;if(!Array.isArray(b)||b.length!==4||center.lng<b[0]||center.lat<b[1]||center.lng>b[2]||center.lat>b[3])return false;updateMarkers(cached.data.trains,{fromCache:true});return true}catch(_){return false}}
    function saveSnapshot(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),bounds:bboxArray(),data}))}catch(_){}}
    async function refreshTrains(){const serial=++trainSerial;if(trainAbort)trainAbort.abort();trainAbort=new AbortController();const start=performance.now();try{const data=await getJson(`${API}/api/map-v2/trains?bbox=${bboxString()}${selectedAtParameter()}`,{signal:trainAbort.signal});if(serial!==trainSerial)return;const ms=performance.now()-start;updateMarkers(data.trains||[],{requestMs:ms});saveSnapshot(data)}catch(error){if(error?.name!=='AbortError')showError(error)}}
    function infraKey(){const b=map.getBounds(),z=Math.max(7,Math.min(11,map.getZoom()));return`${z}|${[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(v=>v.toFixed(2)).join(',')}`}
    async function refreshInfrastructure(){if(map.getZoom()<7){infrastructureLayer.clearLayers();return}const key=infraKey();if(infraCache.has(key)){infrastructureLayer.clearLayers().addData(infraCache.get(key));return}const serial=++infraSerial;if(infraAbort)infraAbort.abort();infraAbort=new AbortController();try{const data=await getJson(`${API}/api/map-v2/infrastructure?bbox=${bboxString()}`,{signal:infraAbort.signal});if(serial!==infraSerial)return;infraCache.set(key,data);if(infraCache.size>5)infraCache.delete(infraCache.keys().next().value);infrastructureLayer.clearLayers().addData(data)}catch(error){if(error?.name!=='AbortError')console.warn('[map-france] infrastructure',error)}}
    function scheduleTrains(delay=100){clearTimeout(trainTimer);trainTimer=setTimeout(refreshTrains,delay)}
    function scheduleInfrastructure(delay=450){clearTimeout(infraTimer);infraTimer=setTimeout(refreshInfrastructure,delay)}
    function idleInfrastructure(){const fn=()=>refreshInfrastructure();if('requestIdleCallback'in window)requestIdleCallback(fn,{timeout:1200});else setTimeout(fn,350)}
    async function cachedTrip(id){if(tripCache.has(id))return tripCache.get(id);const p=getJson(`${API}/api/map-v2/trips/${encodeURIComponent(id)}`).catch(e=>{tripCache.delete(id);throw e});tripCache.set(id,p);return p}
    async function cachedPath(id){if(!id)return null;if(pathCache.has(id))return pathCache.get(id);const p=getJson(`${API}/api/map-v2/paths/${encodeURIComponent(id)}`).catch(e=>{pathCache.delete(id);throw e});pathCache.set(id,p);return p}

    async function selectTrain(train){selectedTrain=train;applySelectionDimming();detailTitleEl.textContent=`${String(normalCategory(train)).toUpperCase()} ${train.number||train.label||''}`.trim();detailMetaEl.textContent='Chargement du parcours…';detailDelayEl.textContent=delayMinutes(train)?`Retard actuel ${delayMinutes(train)>0?'+':''}${delayMinutes(train)} min`:'';stopsEl.innerHTML='';detailEl.hidden=false;document.body.classList.add('has-detail');const [trip,path]=await Promise.all([cachedTrip(train.tripId),cachedPath(train.pathId)]);if(selectedTrain?.tripId!==train.tripId)return;detailTitleEl.textContent=trip.number?`${String(normalCategory(train)).toUpperCase()} ${trip.number}`:(trip.label||train.label||'Train');detailMetaEl.textContent=`${trip.origin||''} → ${trip.destination||''}`;stopsEl.innerHTML=(trip.stops||[]).map(stop=>`<li><span class="stop-time">${escapeHtml(stop.time||'')}</span><span class="stop-name">${escapeHtml(stop.name||'')}</span></li>`).join('');if(selectedPathLayer){selectedPathLayer.remove();selectedPathLayer=null}selectedStopsLayer.clearLayers();if(path){selectedPathLayer=L.geoJSON(path,{renderer:L.canvas({padding:.6}),interactive:false,style:{color:'#168dff',weight:6,opacity:.96}}).addTo(map);selectedPathLayer.bringToFront()}for(const stop of trip.stops||[]){if(!Number.isFinite(Number(stop.lat))||!Number.isFinite(Number(stop.lon)))continue;L.circleMarker([stop.lat,stop.lon],{radius:3.5,color:'#eaffff',weight:1.2,fillColor:'#00eaff',fillOpacity:1}).bindTooltip(`<strong>${escapeHtml(stop.name)}</strong>${stop.time?` · ${escapeHtml(stop.time)}`:''}`,{direction:'top',className:'stop-tip'}).addTo(selectedStopsLayer)}}
    function clearSelection(){selectedTrain=null;if(selectedPathLayer){selectedPathLayer.remove();selectedPathLayer=null}selectedStopsLayer.clearLayers();detailEl.hidden=true;document.body.classList.remove('has-detail');applySelectionDimming()}
    function fitSelectedRoute(){if(selectedPathLayer){const b=selectedPathLayer.getBounds();if(b?.isValid())map.fitBounds(b,{padding:[26,26]})}}
    function showError(error){console.error('[map-france]',error);statusEl.textContent='Données momentanément indisponibles'}

    document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.filter;filters[key]=!filters[key];btn.classList.toggle('is-active',filters[key]);applyFilters()}));
    document.getElementById('franceBtn').addEventListener('click',()=>map.fitBounds(FRANCE_BOUNDS,{padding:[8,8]}));
    document.getElementById('closeDetail').addEventListener('click',clearSelection);
    document.getElementById('fitRouteBtn').addEventListener('click',fitSelectedRoute);
