<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#020611">
<title>Carte La Bétaillère — France GTFS officiel</title>
<link rel="preconnect" href="https://vps.labetaillere.fr" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://eu.ftp.opendatasoft.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#020611;--cyan:#00eaff;--orange:#ffad32;--text:#edfaff;--muted:#8ca8c5}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}html,body{overflow:hidden;background:var(--bg)}body{font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}#map{position:absolute;inset:0;background:#06101c}.leaflet-container{background:#06101c}body.mode-faded .leaflet-tile-pane img{filter:saturate(.48) brightness(.72) contrast(.86);opacity:.66}body.mode-bw .leaflet-tile-pane img{filter:grayscale(1) brightness(.62) contrast(1.05);opacity:.72}body.mode-sat-faded .leaflet-tile-pane img{filter:saturate(.58) brightness(.68) contrast(.9);opacity:.7}.toolbar{position:fixed;z-index:1000;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:6px;min-height:36px;padding:5px 7px;border:1px solid rgba(0,234,255,.3);border-radius:10px;background:linear-gradient(135deg,rgba(2,9,22,.96),rgba(4,20,38,.93));box-shadow:0 8px 24px rgba(0,0,0,.34);backdrop-filter:blur(8px)}.brand{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto}.brand-cow{font-size:15px;line-height:1}.brand-title{font:900 10px/1 Orbitron,Rajdhani,system-ui,sans-serif;letter-spacing:.045em;white-space:nowrap}.source{height:20px;display:inline-flex;align-items:center;padding:0 6px;border-radius:999px;border:1px solid rgba(156,255,0,.34);background:rgba(38,66,0,.18);color:#dfff9a;font:900 8px/1 Rajdhani,system-ui,sans-serif;white-space:nowrap}.status{font:800 9px/1 Rajdhani,system-ui,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:390px}.wide-hide{display:none}.controls{display:flex;align-items:center;gap:4px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.pill,.mini-select,.time-input{height:27px;flex:0 0 auto;border:1px solid rgba(0,234,255,.22);border-radius:7px;background:rgba(4,20,38,.9);color:#eaffff;font:850 9px/1 Rajdhani,system-ui,sans-serif}.pill{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;cursor:pointer}.pill.is-active{border-color:rgba(0,234,255,.72);background:rgba(0,109,143,.27);color:#fff}.pill[data-filter="ter"].is-active{border-color:#00b9d8}.pill[data-filter="tgv"].is-active{border-color:#a76cff}.pill[data-filter="intercites"].is-active{border-color:#ffb347}.pill[data-filter="autres"].is-active{border-color:#aab7c4}.mini-select{padding:0 5px;max-width:92px}.time-input{width:68px;padding:0 4px;color-scheme:dark}.train-icon{background:transparent!important;border:0!important}.train-marker{display:inline-flex;align-items:center;gap:2px;transform:translate(-50%,-50%);white-space:nowrap;will-change:transform}.train-marker .num{display:inline-flex;align-items:center;min-height:16px;padding:1px 4px;border:1px solid currentColor;border-radius:4px;background:rgba(2,10,22,.94);font:900 9px/1 Rajdhani,system-ui,sans-serif;box-shadow:0 2px 4px rgba(0,0,0,.25)}.train-marker.ter{color:#45c8e8}.train-marker.tgv{color:#d8b5ff}.train-marker.intercites{color:#ffc56d}.train-marker.autres{color:#d5dde5}.detail{position:fixed;z-index:1050;top:49px;right:7px;width:min(405px,calc(100vw - 14px));max-height:calc(100dvh - 57px);display:flex;flex-direction:column;overflow:hidden;padding:10px;border:1px solid rgba(0,234,255,.36);border-radius:13px;background:linear-gradient(150deg,rgba(2,9,22,.985),rgba(4,19,37,.97));box-shadow:0 14px 36px rgba(0,0,0,.46);backdrop-filter:blur(9px)}.detail[hidden]{display:none}.detail-head{display:flex;align-items:flex-start;gap:8px;flex:0 0 auto;padding-bottom:7px;border-bottom:1px solid rgba(0,234,255,.17)}.detail-title{min-width:0;flex:1}.detail-title strong{display:block;color:#f4fdff;font:900 14px/1.1 Rajdhani,system-ui,sans-serif}.detail-title span{display:block;margin-top:3px;color:var(--muted);font:700 10px/1.2 Rajdhani,system-ui,sans-serif;overflow-wrap:anywhere}.icon-btn{width:28px;height:28px;flex:0 0 28px;border:1px solid rgba(0,234,255,.24);border-radius:7px;background:rgba(3,21,39,.9);color:#effcff;font-size:18px;line-height:1;cursor:pointer}.stops{list-style:none;margin:6px 0 0;padding:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.stops li{display:grid;grid-template-columns:46px 1fr;gap:7px;align-items:center;min-height:27px;padding:4px 2px;border-bottom:1px solid rgba(0,234,255,.08);font-size:10px}.stops li.current{background:rgba(0,234,255,.08)}.stop-time{color:#88eaff;font-variant-numeric:tabular-nums;font-weight:850}.stop-name{min-width:0;overflow-wrap:anywhere}.loading-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 7px rgba(0,234,255,.7)}body.is-loading .loading-dot{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.25}}.leaflet-control-zoom{border:1px solid rgba(0,234,255,.25)!important;border-radius:8px!important;overflow:hidden!important;box-shadow:none!important}.leaflet-control-zoom a{background:rgba(2,10,24,.94)!important;color:#eaffff!important;border-color:rgba(0,234,255,.15)!important}@media(max-width:900px){.source{display:none}.status{max-width:170px}.pill{padding:0 6px}}@media(max-width:720px){.toolbar{top:5px;left:5px;right:5px;padding:4px 5px;gap:4px;min-height:33px}.brand-title{font-size:9px}.status{font-size:8px;max-width:92px}.brand-cow{font-size:13px}.pill,.mini-select,.time-input{height:25px;font-size:8px}.mini-select{max-width:70px}.time-input{width:61px}.train-marker .num{min-height:14px;padding:1px 3px;font-size:8px}.detail{top:auto;left:5px;right:5px;bottom:5px;width:auto;max-height:55dvh;padding:8px;border-radius:12px}.detail-title strong{font-size:13px}.stops li{min-height:25px;font-size:9.5px}}@media(max-width:430px){.wide{display:none!important}.wide-hide{display:inline}.status{display:none}.brand-title{font-size:8.5px}.controls{gap:3px}.pill{padding:0 5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body class="is-loading">
<div id="map" aria-label="Carte ferroviaire théorique GTFS France"></div>
<div class="toolbar">
  <div class="brand"><span class="brand-cow">🐄</span><span class="brand-title">FRANCE LIVE</span><span class="loading-dot" aria-hidden="true"></span><span class="source">GTFS SNCF OFFICIEL</span></div>
  <div class="status" id="status">Chargement du GTFS officiel…</div>
  <div class="controls" aria-label="Contrôles de carte">
    <button class="pill is-active" id="allBtn" type="button">Tous</button>
    <button class="pill is-active" data-filter="ter" type="button">TER</button>
    <button class="pill is-active" data-filter="tgv" type="button">TGV</button>
    <button class="pill is-active" data-filter="intercites" type="button"><span class="wide">Intercités</span><span class="wide-hide">IC</span></button>
    <button class="pill is-active" data-filter="autres" type="button">Autres</button>
    <button class="pill" id="franceBtn" type="button">France ⌖</button>
    <select class="mini-select" id="baseMap" aria-label="Fond de carte"><option value="standard">Plan</option><option value="faded">Épuré</option><option value="bw">N&B</option><option value="satellite">Satellite</option><option value="sat-faded">Sat. épuré</option></select>
    <input class="time-input" id="mapTime" type="time" step="60" aria-label="Heure affichée">
    <button class="pill is-active" id="liveBtn" type="button">LIVE</button>
  </div>
</div>
<aside class="detail" id="detail" hidden aria-live="polite"><div class="detail-head"><div class="detail-title"><strong id="detailTitle"></strong><span id="detailMeta"></span><span id="detailSub"></span></div><button class="icon-btn" id="closeDetail" type="button" aria-label="Fermer">×</button></div><ol class="stops" id="stops"></ol></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="assets/carte-france-static-gtfs.js?v=20260827-official1"></script>
</body>
</html>
