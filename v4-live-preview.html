<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#020910">
  <title>La Bétaillère V4 — Harmonisation</title>
  <style>
    :root{color-scheme:dark;--bg:#020910;--line:rgba(65,226,240,.3);--cyan:#36e5ef;--text:#effcff;--soft:#9fb9c1;}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    body{display:grid;grid-template-rows:36px minmax(0,1fr)}
    .bar{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);background:#061722;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:2}
    .brand{min-width:0;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;letter-spacing:.09em;white-space:nowrap}
    .brand strong{color:var(--cyan)}
    .status{margin-left:auto;display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--soft);font-size:10px;font-weight:800;white-space:nowrap}
    .status[data-state="ok"]{color:#7ff0b7;border-color:rgba(56,220,149,.5)}
    .status[data-state="error"]{color:#ff919a;border-color:rgba(255,89,103,.5)}
    button{min-height:26px;padding:3px 8px;border:1px solid var(--line);border-radius:9px;background:rgba(9,43,57,.8);color:var(--text);font:800 10px system-ui;cursor:pointer}
    button:hover{border-color:var(--cyan)}
    iframe{display:block;width:100%;height:100%;border:0;background:#020910}
    .note{color:#ffe17a;font-size:9px;font-weight:800;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:680px){.note{display:none}.brand span{display:none}.bar{gap:6px}.status{font-size:9px}.bar button{padding-inline:6px}}
  </style>
</head>
<body>
  <header class="bar" aria-label="Barre de laboratoire V4">
    <div class="brand"><strong>V4 LIVE</strong><span>· INDEX RÉEL HARMONISÉ</span></div>
    <div class="note">Organisation actuelle conservée · composants et fiches harmonisés</div>
    <span id="lbV4LiveStatus" class="status">CHARGEMENT INDEX…</span>
    <button id="lbV4Reload" type="button">Actualiser</button>
    <button id="lbV4OpenProd" type="button">Prod ↗</button>
  </header>
  <iframe id="lbV4LiveFrame" title="La Bétaillère — index réel harmonisé V4" src="/?lb-v4-live-preview=4"></iframe>
  <script src="/assets/lb-v4-live-preview.js?v=20260827-4"></script>
</body>
</html>
