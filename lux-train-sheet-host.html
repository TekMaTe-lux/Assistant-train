<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fiche train La Bétaillère</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131f}
    #host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06131f}
    #boot{position:fixed;inset:0;display:grid;place-items:center;color:#9eeeff;background:#06131f;font:700 14px system-ui,sans-serif;z-index:3;letter-spacing:.04em}
    body.ready #boot{display:none}
  </style>
</head>
<body>
  <div id="boot">Chargement de la fiche…</div>
  <iframe id="host" src="/?luxsheet=host-20260826#search" title="Fiche train La Bétaillère"></iframe>
  <script>
  (()=>{
    'use strict';
    const VPS='https://vps.labetaillere.fr';
    const DEFAULT_RETURN=`${VPS}/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html?v=6133`;
    const returnUrl=(document.referrer && document.referrer.startsWith(VPS + '/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html'))
      ? document.referrer
      : DEFAULT_RETURN;
    const frame=document.getElementById('host');
    let payload=null;
    let childReady=false;
    let bridgeReady=false;
    let closeRequested=false;

    function returnToStation(){
      if(closeRequested) return;
      closeRequested=true;
      try{
        window.parent.postMessage({type:'LB_CLOSE_TRAIN_SHEET'},VPS);
      }catch(_){ }
      // Le parent VPS supprimera l'overlay dès qu'il sait gérer ce message.
      // En attendant, fallback fiable : retour vers la gare qui a ouvert la fiche.
      setTimeout(()=>{
        try{
          if(window.top && window.top!==window) window.top.location.href=returnUrl;
        }catch(_){
          try{ window.location.href=returnUrl; }catch(__){ }
        }
      },180);
    }

    function installCloseHook(){
      try{
        const doc=frame.contentDocument;
        if(!doc || doc.documentElement.dataset.lbLuxCloseHook==='1') return;
        doc.documentElement.dataset.lbLuxCloseHook='1';

        doc.addEventListener('click',(event)=>{
          if(!event.target?.closest?.('#trainDetailClose')) return;
          setTimeout(returnToStation,0);
        },true);

        doc.addEventListener('keydown',(event)=>{
          if(event.key!=='Escape') return;
          const panel=doc.getElementById('trainDetailPanel');
          if(!panel || panel.hidden) return;
          setTimeout(returnToStation,0);
        },true);
      }catch(err){
        console.error('[lux train sheet host] hook fermeture impossible',err);
      }
    }

    function dispatchToChild(){
      if(!payload || !childReady || !bridgeReady) return;
      try{
        const w=frame.contentWindow;
        w.dispatchEvent(new MessageEvent('message',{
          data:payload,
          origin:VPS,
          source:window
        }));
        document.body.classList.add('ready');
        installCloseHook();
      }catch(err){
        console.error('[lux train sheet host] dispatch impossible',err);
      }
    }

    function installBridge(){
      try{
        const doc=frame.contentDocument;
        if(!doc) return;
        childReady=true;
        installCloseHook();

        const existing=doc.getElementById('lb-lux-train-sheet-forced');
        if(existing){
          if(frame.contentWindow.__lbLuxTrainSheetBridgeV2){
            bridgeReady=true;
            dispatchToChild();
          }
          return;
        }

        const script=doc.createElement('script');
        script.id='lb-lux-train-sheet-forced';
        script.src='/assets/lux-train-sheet.js?v=20260826-3';
        script.onload=()=>{
          bridgeReady=true;
          installCloseHook();
          dispatchToChild();
        };
        script.onerror=()=>console.error('[lux train sheet host] pont impossible à charger');
        (doc.head||doc.documentElement).appendChild(script);
      }catch(err){
        console.error('[lux train sheet host] injection impossible',err);
      }
    }

    frame.addEventListener('load',()=>{
      childReady=true;
      bridgeReady=false;
      installBridge();
      setTimeout(installBridge,150);
      setTimeout(()=>{
        installCloseHook();
        if(frame.contentWindow?.__lbLuxTrainSheetBridgeV2){
          bridgeReady=true;
          dispatchToChild();
        }
      },500);
    });

    window.addEventListener('message',(event)=>{
      if(event.origin!==VPS) return;
      if(!event.data || event.data.type!=='LB_OPEN_TRAIN_SHEET') return;
      closeRequested=false;
      payload=event.data;
      dispatchToChild();
      if(!bridgeReady) installBridge();
    });
  })();
  </script>
</body>
</html>
