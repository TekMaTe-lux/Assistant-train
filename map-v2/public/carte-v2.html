<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>La Bétaillère — Carte globale V2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="Carte ferroviaire"></div>
  <header class="toolbar">
    <div>
      <div class="eyebrow">PROJET GLOBAL V2</div>
      <strong>La Bétaillère — France + Luxembourg</strong>
    </div>
    <div class="filters" aria-label="Filtres">
      <label><input id="filter-ter" type="checkbox" checked> TER</label>
      <label><input id="filter-tgv" type="checkbox" checked> TGV</label>
      <label><input id="filter-cfl" type="checkbox" checked> CFL</label>
      <button id="sillon" type="button">Voir le sillon</button>
      <label class="time-control" title="Choisir l'heure affichée">
        <span>Heure</span>
        <input id="map-time" type="time" step="60">
      </label>
      <button id="live-time" type="button">Maintenant</button>
    </div>
    <div id="status" class="status">Initialisation…</div>
  </header>
  <aside id="detail" class="detail hidden" aria-live="polite">
    <button id="close-detail" class="close" type="button" aria-label="Fermer">×</button>
    <div id="detail-content"></div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
