# Include in the vps.labetaillere.fr HTTPS server block.
# Same train events service as the map; browser access limited to the application.
location = /g/c7f290ab {
    proxy_pass http://127.0.0.1:3124/path/events.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "https://www.labetaillere.fr" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET { deny all; }
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json;
}
