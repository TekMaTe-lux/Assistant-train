<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — V2</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050b15}
    body{font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #mapCore{display:block;width:100%;height:100%;border:0;background:#050b15}
  </style>
</head>
<body>
  <iframe id="mapCore" src="carte.html?lbEmbedded=1" title="Carte des trains La Bétaillère" allow="geolocation"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('mapCore');

    const OVERRIDE_CSS=`
      :root{
        --marker-font:12px!important;
        --marker-gap:3px!important;
        --marker-num-font:10.5px!important;
        --marker-num-pad:2px 5px!important;
        --marker-delay-font:9.5px!important;
        --station-font:13px!important;
        --station-pad:2px 3px!important;
      }

      html,body,#map{height:100%!important;min-height:100%!important}
      body{
        margin:0!important;
        overflow:hidden!important;
        background:#050b15!important;
        color:#edf8ff!important;
        font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
      }

      /* En mode intégré, l'interface principale de index.html reste la seule barre haute. */
      header{display:none!important}
      #map{top:0!important}

      /* Contrôles : sobres, lisibles, sans halo animé. */
      .panel{
        top:10px!important;
        width:min(860px,calc(100% - 20px))!important;
        padding:8px 10px!important;
        gap:7px!important;
        border-radius:13px!important;
        color:#eaf8ff!important;
        background:linear-gradient(145deg,rgba(5,13,26,.93),rgba(7,18,34,.9))!important;
        border:1px solid rgba(55,205,255,.28)!important;
        box-shadow:0 8px 24px rgba(0,0,0,.3)!important;
        backdrop-filter:blur(9px)!important;
      }
      .badge{padding:3px 7px!important;border-radius:7px!important;background:rgba(7,21,39,.82)!important;border-color:rgba(68,199,255,.25)!important}

      /* Etiquettes trains compactes : la carte doit rester visible. */
      .cow-marker{
        gap:3px!important;
        filter:none!important;
        text-shadow:none!important;
      }
      .cow-marker .cow-glyph{
        font-size:11px!important;
        opacity:.92!important;
      }
      .cow-marker .train-num{
        min-height:18px!important;
        display:inline-flex!important;
        align-items:center!important;
        padding:1px 5px!important;
        border-radius:5px!important;
        font-size:10.5px!important;
        font-weight:750!important;
        line-height:1.15!important;
        letter-spacing:.015em!important;
        border-width:1px!important;
        box-shadow:0 2px 5px rgba(0,0,0,.26)!important;
        backdrop-filter:blur(5px)!important;
      }
      .cow-marker.train-sncf .train-num{
        background:rgba(8,36,68,.9)!important;
        border-color:rgba(69,180,255,.48)!important;
        color:#d8efff!important;
      }
      .cow-marker.train-cfl .train-num{
        background:rgba(73,13,35,.9)!important;
        border-color:rgba(255,89,126,.48)!important;
        color:#ffe7ed!important;
      }
      .cow-marker.train-tgv-roi .train-num{
        background:rgba(64,45,7,.92)!important;
        border-color:rgba(255,214,102,.5)!important;
        color:#fff1bd!important;
      }
      .cow-marker .train-delay-badge{
        min-height:17px!important;
        margin-left:1px!important;
        padding:1px 5px!important;
        border-radius:5px!important;
        font-size:9.5px!important;
        font-weight:800!important;
        line-height:1.1!important;
        box-shadow:0 2px 5px rgba(0,0,0,.22)!important;
      }

      /* Gares moins présentes visuellement. */
      .station-marker{
        min-width:20px!important;
        min-height:20px!important;
        padding:1px 2px!important;
        border-radius:6px!important;
        font-size:12px!important;
      }

      /* Fiche train / gare = vraie carte Tron cohérente avec index. */
      .trip-panel{
        top:10px!important;
        right:10px!important;
        width:min(380px,calc(100vw - 20px))!important;
        max-height:calc(100vh - 20px)!important;
        padding:10px!important;
        border-radius:15px!important;
        background:linear-gradient(155deg,rgba(5,14,29,.96),rgba(7,19,35,.94))!important;
        border:1px solid rgba(68,196,255,.3)!important;
        box-shadow:0 14px 34px rgba(0,0,0,.42)!important;
        backdrop-filter:blur(10px)!important;
      }
      .trip-panel-close{
        width:30px!important;height:30px!important;
        background:rgba(12,32,55,.9)!important;
        border:1px solid rgba(85,199,255,.22)!important;
        color:#eefaff!important;
      }
      .trip-panel-back{
        border-radius:8px!important;
        border-color:rgba(77,190,255,.25)!important;
        background:rgba(9,27,49,.86)!important;
      }

      /* Tableau gare PC : plus léger et plus proche du design de l'accueil. */
      .station-board,.station-board-grid,.station-board-columns{
        gap:8px!important;
      }
      .station-board table{
        width:100%!important;
        border-collapse:separate!important;
        border-spacing:0 4px!important;
      }
      .station-board th{
        font-size:10px!important;
        letter-spacing:.07em!important;
        color:#8ddcff!important;
      }
      .station-board td{
        padding:5px 6px!important;
        background:rgba(7,20,37,.68)!important;
        border-top:1px solid rgba(64,151,211,.14)!important;
        border-bottom:1px solid rgba(64,151,211,.14)!important;
      }
      .station-board button,.station-board .detail-btn,.station-board .details-btn{
        min-height:27px!important;
        padding:3px 7px!important;
        border-radius:7px!important;
        font-size:10px!important;
        background:rgba(9,30,54,.86)!important;
        border:1px solid rgba(83,180,240,.25)!important;
        color:#f1f9ff!important;
      }

      /* Leaflet controls harmonisés. */
      .leaflet-control-zoom a,.leaflet-control-layers{
        background:rgba(5,17,32,.92)!important;
        color:#eaf8ff!important;
        border-color:rgba(69,191,255,.25)!important;
        box-shadow:none!important;
      }
      .leaflet-popup-content-wrapper,.leaflet-popup-tip{
        background:rgba(5,17,32,.97)!important;
        color:#eaf8ff!important;
      }

      @media(max-width:720px){
        :root{
          --marker-font:10px!important;
          --marker-gap:2px!important;
          --marker-num-font:9px!important;
          --marker-num-pad:1px 4px!important;
          --marker-delay-font:8.5px!important;
          --station-font:11px!important;
        }
        .panel{
          top:6px!important;
          width:calc(100% - 12px)!important;
          padding:6px 7px!important;
          border-radius:11px!important;
          gap:5px!important;
        }
        .panel .badge,.panel .muted{font-size:10px!important}
        .ctrl input[type=range]{width:100px!important}

        .cow-marker .cow-glyph{font-size:9px!important}
        .cow-marker .train-num{
          min-height:16px!important;
          padding:1px 4px!important;
          border-radius:4px!important;
          font-size:9px!important;
        }
        .cow-marker .train-delay-badge{
          min-height:15px!important;
          padding:1px 4px!important;
          font-size:8.5px!important;
          border-radius:4px!important;
        }

        .trip-panel{
          top:auto!important;
          right:6px!important;
          bottom:6px!important;
          left:6px!important;
          width:auto!important;
          max-height:min(62vh,520px)!important;
          padding:8px!important;
          border-radius:15px!important;
        }
        .trip-panel-header{position:sticky!important;top:0!important;z-index:4!important;background:rgba(5,14,29,.94)!important;padding-bottom:5px!important}
        .station-board-now{font-size:14px!important}
        .trip-panel-title{font-size:13px!important}
        .trip-panel-summary{font-size:10.5px!important}
        .trip-stop{font-size:11px!important}

        /* Les deux colonnes gare deviennent une seule colonne sur téléphone. */
        .station-board-grid,.station-board-columns{
          display:grid!important;
          grid-template-columns:1fr!important;
          gap:7px!important;
        }
        .station-board table{font-size:10px!important;border-spacing:0 3px!important}
        .station-board th{font-size:9px!important}
        .station-board td{padding:4px 5px!important}
        .station-board button,.station-board .detail-btn,.station-board .details-btn{
          min-height:25px!important;
          padding:2px 6px!important;
          font-size:9px!important;
        }
      }

      @media(max-width:420px){
        .cow-marker .cow-glyph{display:none!important}
        .station-marker{min-width:18px!important;min-height:18px!important;font-size:10px!important}
        .trip-panel{max-height:68vh!important}
      }

      @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
      }
    `;

    function installTheme(){
      try{
        const doc=frame.contentDocument;
        if(!doc || !doc.head) return;
        if(doc.getElementById('lb-map-v2-theme')) return;
        const style=doc.createElement('style');
        style.id='lb-map-v2-theme';
        style.textContent=OVERRIDE_CSS;
        doc.head.appendChild(style);
        doc.documentElement.classList.add('lb-map-v2');
      }catch(e){
        console.warn('[Carte V2] injection du thème impossible',e);
      }
    }

    frame.addEventListener('load',()=>{
      installTheme();
      setTimeout(installTheme,250);
      setTimeout(installTheme,1200);
    });

    /* Pont de messages pour ne pas casser les échanges si la carte est appelée depuis index.html. */
    window.addEventListener('message',(event)=>{
      if(event.source===frame.contentWindow){
        if(window.parent!==window) window.parent.postMessage(event.data,'*');
        return;
      }
      if(window.parent!==window && event.source===window.parent){
        frame.contentWindow?.postMessage(event.data,'*');
      }
    });

    /* Recalage Leaflet lors des changements de taille / orientation. */
    const nudge=()=>{
      try{
        frame.contentWindow?.dispatchEvent(new Event('resize'));
        const map=frame.contentWindow?.map;
        if(map && typeof map.invalidateSize==='function') map.invalidateSize(false);
      }catch(_){ }
    };
    window.addEventListener('resize',nudge,{passive:true});
    window.addEventListener('orientationchange',()=>setTimeout(nudge,150),{passive:true});
  })();
  </script>
</body>
</html>
