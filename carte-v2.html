<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — V2 Tron</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611}
    body{font-family:Rajdhani,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #mapCore{display:block;width:100%;height:100%;border:0;background:#020611}
  </style>
</head>
<body>
  <iframe id="mapCore" src="carte.html?lbEmbedded=1" title="Carte des trains La Bétaillère" allow="geolocation"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('mapCore');

    const OVERRIDE_CSS=`
      :root{
        --lb-bg:#020611;
        --lb-panel:rgba(3,11,25,.96);
        --lb-panel2:rgba(6,20,38,.94);
        --lb-cyan:#00eaff;
        --lb-blue:#178cff;
        --lb-lime:#a6ff00;
        --lb-purple:#8667ff;
        --lb-red:#ff405c;
        --lb-orange:#ffad32;
        --lb-text:#edfaff;
        --lb-muted:#8ca8c5;
        --marker-font:11px!important;
        --marker-gap:2px!important;
        --marker-num-font:10px!important;
        --marker-num-pad:1px 5px!important;
        --marker-delay-font:9px!important;
        --station-font:12px!important;
        --station-pad:2px 3px!important;
      }

      html,body,#map{height:100%!important;min-height:100%!important}
      body{
        margin:0!important;
        overflow:hidden!important;
        background:var(--lb-bg)!important;
        color:var(--lb-text)!important;
        font-family:Rajdhani,Orbitron,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
      }
      header{display:none!important}
      #map{top:0!important}

      /* Ambiance générale TRON La Bétaillère, statique pour garder la fluidité. */
      .leaflet-container{
        background:#03101c!important;
      }
      .leaflet-control-container{font-family:Rajdhani,system-ui,sans-serif!important}
      .leaflet-control-zoom,
      .leaflet-control-layers,
      .leaflet-bar{
        border:1px solid rgba(0,234,255,.28)!important;
        border-radius:10px!important;
        overflow:hidden!important;
        box-shadow:0 0 0 1px rgba(0,234,255,.04),0 8px 22px rgba(0,0,0,.32)!important;
      }
      .leaflet-control-zoom a,.leaflet-control-layers{
        background:rgba(2,10,23,.94)!important;
        color:#e9fbff!important;
        border-color:rgba(0,234,255,.16)!important;
      }
      .leaflet-control-zoom a:hover{background:rgba(0,234,255,.12)!important;color:#fff!important}
      .leaflet-popup-content-wrapper,.leaflet-popup-tip{
        background:rgba(2,10,23,.97)!important;
        color:#eafcff!important;
      }
      .leaflet-popup-content-wrapper{border:1px solid rgba(0,234,255,.32)!important;border-radius:12px!important}

      /* Bandeau outils carte */
      .panel{
        top:8px!important;
        width:min(900px,calc(100% - 18px))!important;
        padding:7px 9px!important;
        gap:7px!important;
        border-radius:12px!important;
        color:#ecfbff!important;
        background:linear-gradient(135deg,rgba(2,9,22,.97),rgba(4,20,38,.94))!important;
        border:1px solid rgba(0,234,255,.34)!important;
        box-shadow:0 0 0 1px rgba(91,81,255,.08),0 8px 26px rgba(0,0,0,.34)!important;
        backdrop-filter:blur(9px)!important;
      }
      .panel::before{
        content:""!important;
        position:absolute!important;
        left:14px!important;right:14px!important;top:-1px!important;
        height:1px!important;
        background:linear-gradient(90deg,transparent,var(--lb-cyan),transparent)!important;
        opacity:.8!important;
      }
      .badge{
        padding:3px 7px!important;
        border-radius:6px!important;
        background:rgba(4,19,36,.86)!important;
        border-color:rgba(0,234,255,.22)!important;
        box-shadow:none!important;
        color:#dffaff!important;
      }
      .muted{color:#8eadc9!important}

      /* Etiquettes train : beaucoup plus fines. */
      .cow-marker{gap:2px!important;filter:none!important;text-shadow:none!important}
      .cow-marker .cow-glyph{font-size:10px!important;opacity:.9!important}
      .cow-marker .train-num{
        min-height:17px!important;
        display:inline-flex!important;
        align-items:center!important;
        padding:1px 5px!important;
        border-radius:4px!important;
        font-size:10px!important;
        font-weight:800!important;
        line-height:1.05!important;
        letter-spacing:.02em!important;
        border-width:1px!important;
        box-shadow:0 2px 5px rgba(0,0,0,.26)!important;
        backdrop-filter:blur(4px)!important;
      }
      .cow-marker.train-sncf .train-num{
        background:rgba(2,27,52,.91)!important;
        border-color:rgba(0,199,255,.58)!important;
        color:#dff8ff!important;
      }
      .cow-marker.train-cfl .train-num{
        background:rgba(66,8,37,.91)!important;
        border-color:rgba(255,64,130,.58)!important;
        color:#ffe8f1!important;
      }
      .cow-marker.train-tgv-roi .train-num{
        background:rgba(58,40,4,.92)!important;
        border-color:rgba(255,211,83,.56)!important;
        color:#fff2b5!important;
      }
      .cow-marker .train-delay-badge{
        min-height:16px!important;
        margin-left:0!important;
        padding:1px 4px!important;
        border-radius:4px!important;
        font-size:9px!important;
        font-weight:900!important;
        line-height:1!important;
        box-shadow:none!important;
      }
      .cow-marker .train-delay-badge--moderate{background:rgba(255,183,58,.96)!important;color:#111722!important}
      .cow-marker .train-delay-badge--major{background:rgba(255,124,54,.96)!important;color:#fff!important}
      .cow-marker .train-delay-badge--severe{background:rgba(255,55,80,.96)!important;color:#fff!important}
      .cow-marker .train-delay-badge--cancelled{background:rgba(133,17,51,.96)!important;color:#fff!important}

      /* Gares */
      .station-marker{
        min-width:20px!important;min-height:20px!important;
        padding:1px 2px!important;border-radius:5px!important;font-size:11px!important;
      }
      .station-marker.station-major{color:#dffb74!important;border-color:rgba(166,255,0,.35)!important;background:rgba(38,66,0,.14)!important}
      .station-marker.station-regular{color:#b9f8ff!important;border-color:rgba(0,234,255,.22)!important;background:rgba(0,234,255,.07)!important}

      /* Panneau gare / train */
      .trip-panel{
        top:8px!important;
        right:8px!important;
        width:min(430px,calc(100vw - 16px))!important;
        max-height:calc(100vh - 16px)!important;
        padding:10px!important;
        gap:8px!important;
        border-radius:14px!important;
        background:linear-gradient(150deg,rgba(2,9,22,.985),rgba(4,19,37,.97))!important;
        border:1px solid rgba(0,234,255,.38)!important;
        box-shadow:0 0 0 1px rgba(90,80,255,.08),0 16px 40px rgba(0,0,0,.44)!important;
        backdrop-filter:blur(11px)!important;
      }
      .trip-panel::before{
        content:""!important;position:absolute!important;left:18px!important;right:18px!important;top:-1px!important;height:1px!important;
        background:linear-gradient(90deg,transparent,var(--lb-cyan),transparent)!important;
      }
      .trip-panel-header{
        padding:2px 2px 7px!important;
        border-bottom:1px solid rgba(0,234,255,.16)!important;
      }
      .station-board-now{font-size:14px!important;color:#f1fdff!important;font-weight:800!important;letter-spacing:.02em!important}
      .trip-panel-title{font-size:14px!important;font-weight:800!important;color:#f1fdff!important}
      .trip-panel-summary{font-size:11px!important;color:#9bb3ca!important}
      .trip-panel-close{
        width:29px!important;height:29px!important;
        background:rgba(3,21,39,.92)!important;
        border:1px solid rgba(0,234,255,.25)!important;
        color:#eefcff!important;
      }
      .trip-panel-close:hover{background:rgba(0,234,255,.14)!important;color:#fff!important}
      .trip-panel-back{
        border-radius:7px!important;
        border-color:rgba(0,234,255,.25)!important;
        background:rgba(3,21,39,.88)!important;
        color:#e8fbff!important;
      }

      /* Toggle Départs / Arrivées façon capture mais version Tron #BER. */
      .lb-station-tabs{
        display:flex!important;
        width:max-content!important;
        max-width:100%!important;
        gap:3px!important;
        padding:3px!important;
        margin:0 0 3px!important;
        border-radius:9px!important;
        background:rgba(2,10,23,.88)!important;
        border:1px solid rgba(0,234,255,.25)!important;
      }
      .lb-station-tab{
        appearance:none!important;
        border:0!important;
        min-height:28px!important;
        padding:5px 12px!important;
        border-radius:6px!important;
        background:transparent!important;
        color:#91adc5!important;
        font:800 11px/1 Rajdhani,system-ui,sans-serif!important;
        letter-spacing:.035em!important;
        cursor:pointer!important;
      }
      .lb-station-tab.is-active{
        color:#fff!important;
        background:linear-gradient(135deg,rgba(20,96,180,.92),rgba(92,71,222,.92))!important;
        box-shadow:inset 0 0 0 1px rgba(132,235,255,.25)!important;
      }

      /* Horaires gare : cartes plutôt qu'un gros tableau administratif. */
      .station-board,.station-board-grid,.station-board-columns{gap:7px!important}
      .station-board table{width:100%!important;border-collapse:separate!important;border-spacing:0 5px!important}
      .station-board th{
        padding:0 6px 2px!important;
        font-size:9px!important;
        letter-spacing:.1em!important;
        text-transform:uppercase!important;
        color:#63dff5!important;
      }
      .station-board td{
        padding:6px 7px!important;
        background:linear-gradient(135deg,rgba(5,18,33,.9),rgba(4,14,28,.86))!important;
        border-top:1px solid rgba(0,234,255,.13)!important;
        border-bottom:1px solid rgba(0,234,255,.13)!important;
      }
      .station-board tr td:first-child{border-left:2px solid rgba(92,100,255,.8)!important;border-radius:7px 0 0 7px!important}
      .station-board tr td:last-child{border-right:1px solid rgba(0,234,255,.13)!important;border-radius:0 7px 7px 0!important}
      .station-board button,.station-board .detail-btn,.station-board .details-btn{
        min-height:25px!important;
        padding:3px 7px!important;
        border-radius:6px!important;
        font-size:9px!important;
        background:rgba(3,24,44,.9)!important;
        border:1px solid rgba(0,234,255,.22)!important;
        color:#e9fbff!important;
      }

      /* Pastilles d'état ajoutées automatiquement aux lignes quand le texte le permet. */
      .lb-row-status{
        display:inline-flex!important;align-items:center!important;justify-content:center!important;
        min-height:18px!important;padding:2px 6px!important;margin-left:5px!important;
        border-radius:999px!important;font-size:9px!important;font-weight:900!important;white-space:nowrap!important;
        border:1px solid transparent!important;
      }
      .lb-row-status.is-ontime{color:#baffdc!important;background:rgba(0,151,92,.13)!important;border-color:rgba(20,255,163,.27)!important}
      .lb-row-status.is-delay{color:#ffe0a8!important;background:rgba(255,151,31,.14)!important;border-color:rgba(255,179,64,.32)!important}
      .lb-row-status.is-arrived{color:#b8ecff!important;background:rgba(0,167,255,.13)!important;border-color:rgba(0,210,255,.28)!important}
      .lb-row-status.is-cancelled{color:#ffc0ca!important;background:rgba(255,54,82,.13)!important;border-color:rgba(255,75,101,.32)!important}

      .lb-hidden-board{display:none!important}

      @media(max-width:720px){
        :root{--marker-font:9px!important;--marker-gap:1px!important;--marker-num-font:8.5px!important;--marker-num-pad:1px 3px!important;--marker-delay-font:8px!important;--station-font:10px!important}
        .panel{top:5px!important;width:calc(100% - 10px)!important;padding:5px 6px!important;border-radius:9px!important;gap:4px!important}
        .panel .badge,.panel .muted{font-size:9px!important}.ctrl input[type=range]{width:92px!important}
        .cow-marker .cow-glyph{font-size:8px!important}
        .cow-marker .train-num{min-height:15px!important;padding:1px 3px!important;border-radius:3px!important;font-size:8.5px!important}
        .cow-marker .train-delay-badge{min-height:14px!important;padding:1px 3px!important;font-size:8px!important;border-radius:3px!important}

        .trip-panel{
          top:auto!important;right:5px!important;bottom:5px!important;left:5px!important;
          width:auto!important;max-height:min(70vh,590px)!important;
          padding:8px!important;border-radius:13px!important;
        }
        .trip-panel-header{position:sticky!important;top:0!important;z-index:6!important;background:rgba(2,9,22,.97)!important}
        .station-board-now{font-size:13px!important}
        .lb-station-tabs{width:100%!important;box-sizing:border-box!important}
        .lb-station-tab{flex:1!important;min-height:30px!important;padding:5px 8px!important;font-size:10px!important}
        .station-board-grid,.station-board-columns{display:grid!important;grid-template-columns:1fr!important;gap:6px!important}
        .station-board table{font-size:9.5px!important;border-spacing:0 4px!important}
        .station-board th{font-size:8.5px!important}.station-board td{padding:5px!important}
        .station-board button,.station-board .detail-btn,.station-board .details-btn{min-height:24px!important;padding:2px 5px!important;font-size:8.5px!important}
        .trip-panel-title{font-size:12.5px!important}.trip-panel-summary{font-size:10px!important}.trip-stop{font-size:10.5px!important}
      }

      @media(max-width:420px){
        .cow-marker .cow-glyph{display:none!important}
        .station-marker{min-width:17px!important;min-height:17px!important;font-size:9px!important}
        .trip-panel{max-height:73vh!important}
      }

      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    `;

    function sectionForLabel(label){
      let node=label;
      for(let i=0;i<6 && node;i++,node=node.parentElement){
        if(!node.parentElement) break;
        const txt=(node.innerText||'').trim().toUpperCase();
        if(txt.length>label.innerText.trim().length && (node.querySelector('table') || node.querySelector('button'))){
          return node;
        }
      }
      return label.parentElement;
    }

    function enhanceStationBoard(doc){
      const panel=doc.querySelector('.trip-panel:not(.hidden)');
      if(!panel) return;

      const nodes=[...panel.querySelectorAll('h1,h2,h3,h4,h5,div,span,strong')];
      const depLabel=nodes.find(n=>/^D[ÉE]PARTS?$/.test((n.textContent||'').trim().toUpperCase()));
      const arrLabel=nodes.find(n=>/^ARRIV[ÉE]ES?$/.test((n.textContent||'').trim().toUpperCase()));
      if(!depLabel || !arrLabel) return;

      const dep=sectionForLabel(depLabel);
      const arr=sectionForLabel(arrLabel);
      if(!dep || !arr || dep===arr) return;

      dep.dataset.lbBoard='departures';
      arr.dataset.lbBoard='arrivals';

      if(!panel.querySelector('.lb-station-tabs')){
        const tabs=doc.createElement('div');
        tabs.className='lb-station-tabs';
        tabs.innerHTML='<button type="button" class="lb-station-tab is-active" data-lb-tab="departures">Départs</button><button type="button" class="lb-station-tab" data-lb-tab="arrivals">Arrivées</button>';
        const body=panel.querySelector('.trip-panel-body') || panel;
        body.insertBefore(tabs,body.firstChild);
        const select=(name)=>{
          dep.classList.toggle('lb-hidden-board',name!=='departures');
          arr.classList.toggle('lb-hidden-board',name!=='arrivals');
          tabs.querySelectorAll('.lb-station-tab').forEach(b=>b.classList.toggle('is-active',b.dataset.lbTab===name));
        };
        tabs.addEventListener('click',e=>{
          const b=e.target.closest('[data-lb-tab]');
          if(b) select(b.dataset.lbTab);
        });
        select('departures');
      }

      /* Ajoute une pastille synthétique à chaque ligne à partir du texte existant. */
      panel.querySelectorAll('tr').forEach(row=>{
        if(row.querySelector('.lb-row-status')) return;
        const txt=(row.innerText||'').replace(/\s+/g,' ').trim();
        if(!txt || /DESTINATION|PROVENANCE|HEURE/i.test(txt)) return;
        let label='',cls='';
        if(/supprim|annul/i.test(txt)){label='Supprimé';cls='is-cancelled';}
        else if(/arriv[ée]|terminus/i.test(txt)){label='Arrivé';cls='is-arrived';}
        else {
          const m=txt.match(/\+(\d+)\s*min/i);
          if(m){label='+'+m[1]+' min';cls='is-delay';}
          else if(/[àa] l['’]?heure|on time/i.test(txt)){label='À l’heure';cls='is-ontime';}
        }
        if(!label) return;
        const target=row.querySelector('td:nth-last-child(2)') || row.querySelector('td:last-child');
        if(!target) return;
        const pill=doc.createElement('span');
        pill.className='lb-row-status '+cls;
        pill.textContent=label;
        target.appendChild(pill);
      });
    }

    function installTheme(){
      try{
        const doc=frame.contentDocument;
        if(!doc || !doc.head) return;
        if(!doc.getElementById('lb-map-v2-theme')){
          const style=doc.createElement('style');
          style.id='lb-map-v2-theme';
          style.textContent=OVERRIDE_CSS;
          doc.head.appendChild(style);
          doc.documentElement.classList.add('lb-map-v2');
        }
        enhanceStationBoard(doc);
        if(!doc.__lbV2Observer){
          const obs=new MutationObserver(()=>enhanceStationBoard(doc));
          obs.observe(doc.body,{childList:true,subtree:true,characterData:true});
          doc.__lbV2Observer=obs;
        }
      }catch(e){console.warn('[Carte V2] injection impossible',e)}
    }

    frame.addEventListener('load',()=>{
      installTheme();
      setTimeout(installTheme,250);
      setTimeout(installTheme,1000);
    });

    window.addEventListener('message',(event)=>{
      if(event.source===frame.contentWindow){
        if(window.parent!==window) window.parent.postMessage(event.data,'*');
        return;
      }
      if(window.parent!==window && event.source===window.parent) frame.contentWindow?.postMessage(event.data,'*');
    });

    const nudge=()=>{
      try{
        frame.contentWindow?.dispatchEvent(new Event('resize'));
        const map=frame.contentWindow?.map;
        if(map && typeof map.invalidateSize==='function') map.invalidateSize(false);
      }catch(_){ }
    };
    window.addEventListener('resize',nudge,{passive:true});
    window.addEventListener('orientationchange',()=>setTimeout(nudge,150),{passive:true});
  })();
  </script>
</body>
</html>
