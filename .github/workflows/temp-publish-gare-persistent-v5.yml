name: Temp publish gare persistent v5
on:
  push:
    paths:
      - '.github/workflows/temp-publish-gare-persistent-v5.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='carte.html?embed=1&v=20260917-gare-persistent-v4'
          new='carte.html?embed=1&v=20260917-gare-persistent-v5'
          if old not in s: raise SystemExit('index v4 not found')
          p.write_text(s.replace(old,new,1))
          sw=Path('service-worker.js'); t=sw.read_text()
          if "const CACHE_VERSION = 'v62';" not in t: raise SystemExit('sw v62 not found')
          sw.write_text(t.replace("const CACHE_VERSION = 'v62';","const CACHE_VERSION = 'v63';",1))
          PY
      - name: Validate
        run: |
          node --check service-worker.js
          grep -F 'gare-persistent-v5' index.html
          grep -F "CACHE_VERSION = 'v63'" service-worker.js
      - name: Commit patch
        run: |
          git config user.name 'TekMaTe-lux'
          git config user.email 'm.fresse54@gmail.com'
          git add index.html service-worker.js
          git commit -m 'Ship persistent Luxembourg station wrapper v5'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/temp-publish-gare-persistent-v5.yml
          git commit -m 'Remove temporary station publish workflow v5'
          git push
