name: Apply exceptional terminal SNCF fix

on:
  push:
    paths:
      - '.github/workflows/apply-exceptional-terminal-sncf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply targeted patch
        run: python3 .github/scripts/fix_exceptional_terminal_sncf.py

      - name: Validate
        run: |
          git diff --check
          grep -n "isSncfExplicitPartialTerminal" index.html
          grep -n "data-terminal-arrival=\"1\"" index.html
          grep -n "terminal-partial-base" index.html
          grep -n "terminal-partial-new" index.html
          git diff --stat -- index.html

      - name: Commit
        run: |
          test -n "$(git status --porcelain -- index.html)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: derive exceptional terminal from SNCF stop statuses"
          git push origin HEAD:main
