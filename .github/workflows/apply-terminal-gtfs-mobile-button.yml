name: Apply terminal GTFS and mobile button fix

on:
  push:
    paths:
      - '.github/workflows/apply-terminal-gtfs-mobile-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply targeted patch
        run: python3 .github/scripts/fix_terminal_gtfs_mobile_button.py

      - name: Validate
        run: |
          git diff --check
          grep -n "terminal-partial-base" index.html | head
          grep -n "TERMINUS EXCEPTIONNEL'" index.html | head
          grep -n "lb-mobile-v4.css?v=10" index.html
          grep -n "lb-mobile-v4.js?v=5" index.html
          grep -n "const label = mobile ? \"Générer\"" assets/lb-mobile-v4.js
          grep -n "action finale compacte, jaune" assets/lb-mobile-v4.css
          git diff --stat -- index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css

      - name: Commit
        run: |
          test -n "$(git status --porcelain -- index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css
          git commit -m "fix: preserve terminal delay styling and mobile generate button"
          git push origin HEAD:main
