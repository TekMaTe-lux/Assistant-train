name: Patch Voix partial detail v4

on:
  push:
    paths:
      - '.github/workflows/one-shot-voice-partial-detail-v4.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch shared partial-cancellation detail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          profile_start = text.index('<script id="lb-train-profile-v1-script">')
          profile_end = text.index('</script>', profile_start)
          profile = text[profile_start:profile_end]

          if 'async function getOfficialServicePattern(numberValue, dateValue)' not in profile:
              init_marker = '  function init() {\n'
              if profile.count(init_marker) != 1:
                  raise SystemExit('Unified profile init marker is not unique')
              helper = '''  async function getOfficialServicePattern(numberValue, dateValue) {
            const number = normalizeTrainNumber(numberValue);
            const dateIso = /^\\d{4}-\\d{2}-\\d{2}$/.test(String(dateValue || ''))
              ? String(dateValue)
              : todayIso();
            if (!number) return { rows: [], liveBundle: null };

            const [liveResult, staticResult] = await Promise.allSettled([
              loadLiveBundle(number, dateIso, false),
              fetchStaticCandidates(number, dateIso)
            ]);
            const liveBundle = liveResult.status === 'fulfilled' ? liveResult.value : null;
            const candidates = staticResult.status === 'fulfilled' ? staticResult.value : [];
            const chosen = chooseStaticCandidate(candidates, liveBundle, dateIso);
            const liveJourneyRows = normalizeJourneyRows(liveBundle);
            let rows = liveJourneyRows.length
              ? liveJourneyRows
              : normalizeStaticRows(chosen, liveBundle);
            rows = applyEffectiveServicePattern(rows, liveBundle);
            return { rows, liveBundle };
          }

          '''
              profile = profile.replace(init_marker, helper + init_marker, 1)

          export_marker = '    window.lbOpenTrainProfile = openTrainProfile;\n'
          if 'window.lbGetOfficialServicePattern = getOfficialServicePattern;' not in profile:
              if profile.count(export_marker) != 1:
                  raise SystemExit('Unified profile export marker is not unique')
              profile = profile.replace(
                  export_marker,
                  export_marker + '    window.lbGetOfficialServicePattern = getOfficialServicePattern;\n',
                  1
              )

          text = text[:profile_start] + profile + text[profile_end:]

          detail_start = text.index('  async function renderTrainDetail(trainNumber){')
          detail_end = text.index('  function signalTrainOptionsSignature', detail_start)
          detail = text[detail_start:detail_end]

          if 'window.lbGetOfficialServicePattern(train.trainNumber' not in detail:
              signals_marker = '    const signals = getSignalsForTrain(train.trainNumber);\n'
              official_setup = '''    let officialRows = [];
            try {
              if (typeof window.lbGetOfficialServicePattern === 'function') {
                const official = await window.lbGetOfficialServicePattern(train.trainNumber, toYmd());
                officialRows = Array.isArray(official?.rows) ? official.rows : [];
              }
            } catch (err) {
              console.warn('[Voix du bétail] parcours officiel indisponible', err?.message || err);
            }
            const voiceStopKey = (value)=> String(value || '')
              .normalize('NFD')
              .replace(/[\\u0300-\\u036f]/g, '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '');
            const officialByStop = new Map(
              officialRows
                .map((row)=> [voiceStopKey(row?.name), row])
                .filter(([key])=> key)
            );
            const signals = getSignalsForTrain(train.trainNumber);
          '''
              if detail.count(signals_marker) != 1:
                  raise SystemExit('Voix signals marker not found exactly once')
              detail = detail.replace(signals_marker, official_setup, 1)

          if 'const officialRow = officialByStop.get' not in detail:
              stop_name = "      const stopName = row?.name || '';\n"
              flags = '''      const stopName = row?.name || '';
                const officialRow = officialByStop.get(voiceStopKey(stopName)) || null;
                const officialDeleted = !!officialRow?.isDeleted;
                const officialNewOrigin = !!officialRow?.isNewOrigin;
                const officialNewTerminus = !!officialRow?.isNewTerminus;
          '''
              if detail.count(stop_name) != 1:
                  raise SystemExit('Voix stopName line not unique')
              detail = detail.replace(stop_name, flags, 1)

          if 'if (officialDeleted){' not in detail:
              delay_branch = "      if (hasGtfsDelay){\n"
              official_branch = '''      if (officialDeleted){
                timeClass = 'lb-train-stop-time is-cancel';
                timeHtml = `<span class="actual">${safeEscape(baseTime)}</span>`;
              } else if (hasGtfsDelay){
          '''
              if detail.count(delay_branch) != 1:
                  raise SystemExit('Voix delay branch not unique')
              detail = detail.replace(delay_branch, official_branch, 1)

          if 'SUPPRIMÉ · arrêt non desservi' not in detail:
              chips = "      const chipsList = [];\n"
              official_chips = '''      const chipsList = [];
                if (officialDeleted) {
                  chipsList.push('<span class="lb-stop-chip lb-stop-chip--suppression" title="Donnée officielle SNCF">SUPPRIMÉ · arrêt non desservi</span>');
                } else if (officialNewOrigin) {
                  chipsList.push('<span class="lb-stop-chip lb-stop-chip--a-lheure" title="Donnée officielle SNCF">DÉPART EXCEPTIONNEL</span>');
                } else if (officialNewTerminus) {
                  chipsList.push('<span class="lb-stop-chip lb-stop-chip--a-lheure" title="Donnée officielle SNCF">TERMINUS EXCEPTIONNEL</span>');
                }
          '''
              if detail.count(chips) != 1:
                  raise SystemExit('Voix chips marker not unique')
              detail = detail.replace(chips, official_chips, 1)

          text = text[:detail_start] + detail + text[detail_end:]
          path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/live-partial-cancellation.test.js')
          tests = tests_path.read_text(encoding='utf-8')
          if "Voix detail reuses the unified official service pattern" not in tests:
              test_block = r'''
          
          test('Voix detail reuses the unified official service pattern', () => {
            const profile = between('async function getOfficialServicePattern(numberValue, dateValue)', 'function init()');
            assert.match(profile, /loadLiveBundle/);
            assert.match(profile, /applyEffectiveServicePattern/);
            assert.match(source, /window\.lbGetOfficialServicePattern = getOfficialServicePattern/);

            const detail = between('async function renderTrainDetail(trainNumber)', 'function signalTrainOptionsSignature');
            assert.match(detail, /lbGetOfficialServicePattern/);
            assert.match(detail, /officialDeleted/);
            assert.match(detail, /officialNewOrigin/);
            assert.match(detail, /officialNewTerminus/);
            assert.match(detail, /SUPPRIMÉ · arrêt non desservi/);
            assert.match(detail, /DÉPART EXCEPTIONNEL/);
            assert.match(detail, /TERMINUS EXCEPTIONNEL/);
          });
          '''
              tests_path.write_text(tests + test_block, encoding='utf-8')
          PY

      - name: Run focused tests
        shell: bash
        run: node --test tests/live-partial-cancellation.test.js

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/live-partial-cancellation.test.js
          if git diff --cached --quiet; then
            echo "No application change to commit"
            exit 0
          fi
          git commit -m "Harmonize Voix partial cancellation details"
          git push
