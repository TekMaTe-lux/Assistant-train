name: One-off Info trafic v3 refactor

on:
  push:
    branches:
      - fix/info-trafic-v3-20260831

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/info-trafic-v3-20260831
          fetch-depth: 0

      - name: Refactor Info trafic in existing mobile layer
        run: python3 .github/scripts/oneoff_info_traffic_v3.py

      - name: Validate CSS-only diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "assets/lb-mobile-v4.css"
          grep -q 'traffic-pill::before' assets/lb-mobile-v4.css
          grep -q 'radial-gradient(circle at 50% 80%, #58e8f3' assets/lb-mobile-v4.css
          grep -q 'border-left: 2px solid var(--traffic-line' assets/lb-mobile-v4.css

      - name: Commit clean result and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-info-traffic-v3.yml
          rm -f .github/scripts/oneoff_info_traffic_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lb-mobile-v4.css .github/workflows/oneoff-info-traffic-v3.yml .github/scripts/oneoff_info_traffic_v3.py
          git diff --cached --check
          git commit -m "Affinage du bloc Info trafic mobile"
          git push origin HEAD:fix/info-trafic-v3-20260831
