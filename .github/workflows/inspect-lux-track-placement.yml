name: Inspect Luxembourg track placement
on:
  push:
    paths:
      - '.github/workflows/inspect-lux-track-placement.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Luxembourg page and inspect placement logic
        shell: bash
        run: |
          set -euo pipefail
          URL='https://vps.labetaillere.fr/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html'
          curl -fsSL "$URL" -o /tmp/lux.html
          python3 - <<'PY' > tmp-lux-track-inspect.txt
          from pathlib import Path
          import re
          s=Path('/tmp/lux.html').read_text(encoding='utf-8', errors='replace')
          lines=s.splitlines()
          print('bytes=', len(s))
          pats=[
            r'14AB', r'13AB', r'12AB', r'11AB', r'10AB', r'9AB',
            r'track[^\n]{0,160}(?:y|lane|side|platform)',
            r'(?:y|lane|side|platform)[^\n]{0,160}track',
            r'pair', r'odd', r'even', r'%\s*2', r'parseInt\([^\n]{0,100}track',
            r'platformY', r'trackY', r'laneY', r'getTrack', r'positionTrain', r'renderTrain',
            r'voie', r'quai'
          ]
          hits=[]
          for i,line in enumerate(lines,1):
              if any(re.search(p,line,re.I) for p in pats): hits.append(i)
          intervals=[]
          for i in hits:
              a=max(1,i-5); b=min(len(lines),i+8)
              if intervals and a <= intervals[-1][1]+1:
                  intervals[-1]=(intervals[-1][0], max(intervals[-1][1], b))
              else:
                  intervals.append((a,b))
          for a,b in intervals:
              print(f'\n===== lines {a}-{b} =====')
              for n in range(a,b+1): print(f'{n:05d}: {lines[n-1]}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-lux-track-inspect.txt
          git commit -m 'Temporary Luxembourg track placement inspection' || exit 0
          git push
