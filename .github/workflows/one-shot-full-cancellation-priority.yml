name: One-shot full cancellation priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-full-cancellation-priority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        run: python3 scripts/patch_full_cancellation_priority.py

      - name: Check JavaScript contracts
        run: node --test tests/live-partial-cancellation.test.js

      - name: Check whitespace
        run: git diff --check

      - name: Commit validated patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_full_cancellation_priority.py
          git rm .github/workflows/one-shot-full-cancellation-priority.yml
          git add index.html tests/live-partial-cancellation.test.js
          git diff --cached --check
          git commit -m "Priorise les suppressions totales SNCF dans LIVE"
          git push origin HEAD:main
