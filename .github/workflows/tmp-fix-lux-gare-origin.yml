name: tmp-fix-lux-gare-origin
on:
  push:
    paths:
      - '.github/workflows/tmp-fix-lux-gare-origin.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Luxembourg train-sheet origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/lux-train-sheet.js')
          s=p.read_text()
          old="open.call(window, raw[0], dateIso, { origin:'lux-gare' })"
          new="open.call(window, raw[0], dateIso, { origin:'map' })"
          if old not in s:
              raise SystemExit('expected origin marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/lux-train-sheet.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lux-train-sheet.js
          git rm .github/workflows/tmp-fix-lux-gare-origin.yml
          git commit -m 'Fix Luxembourg train sheet blur context'
          git push
