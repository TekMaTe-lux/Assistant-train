name: One-off mobile home typography refactor

on:
  push:
    branches:
      - fix/mobile-home-typography-20260831

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-home-typography-20260831
          fetch-depth: 0

      - name: Refactor existing mobile layer in place
        run: python3 .github/scripts/oneoff_mobile_home_typography.py

      - name: Validate CSS-only diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "assets/lb-mobile-v4.css"
          grep -q -- '--lb-home-title-slot: 22px' assets/lb-mobile-v4.css
          grep -q -- 'height: var(--lb-home-control-h)' assets/lb-mobile-v4.css
          test "$(grep -c 'body.lb-v3 #home #homePunctCardTitle' assets/lb-mobile-v4.css)" = "0"

      - name: Commit clean result and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-mobile-home-typography.yml
          rm -f .github/scripts/oneoff_mobile_home_typography.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lb-mobile-v4.css .github/workflows/oneoff-mobile-home-typography.yml .github/scripts/oneoff_mobile_home_typography.py
          git diff --cached --check
          git commit -m "refactor: harmonise mobile home typography"
          git push origin HEAD:fix/mobile-home-typography-20260831
