name: One-off mobile home typography refactor

on:
  push:
    branches:
      - fix/mobile-home-typography-20260831

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-home-typography-20260831
          fetch-depth: 0

      - name: Refactor existing mobile layer in place
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/lb-mobile-v4.css')
          text = path.read_text(encoding='utf-8')
          original = text

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          # Centralise the homepage mobile typography/vertical rhythm in the existing
          # mobile stylesheet. This deliberately replaces local values instead of
          # adding another override/patch layer.
          once(
              '    --lb-mobile-radius: 17px;\n',
              '    --lb-mobile-radius: 17px;\n'
              '    /* Accueil : une seule échelle typographique et verticale. */\n'
              '    --lb-home-title-size: 14px;\n'
              '    --lb-home-title-line: 18px;\n'
              '    --lb-home-title-slot: 22px;\n'
              '    --lb-home-subtitle-size: 13px;\n'
              '    --lb-home-text-size: 12.5px;\n'
              '    --lb-home-text-line: 16px;\n'
              '    --lb-home-meta-size: 11px;\n'
              '    --lb-home-meta-line: 14px;\n'
              '    --lb-home-control-size: 12px;\n'
              '    --lb-home-control-line: 16px;\n'
              '    --lb-home-control-h: 30px;\n'
              '    --lb-home-action-h: 32px;\n'
              '    --lb-home-badge-size: 10px;\n'
              '    --lb-home-badge-line: 12px;\n',
              'home typography tokens'
          )

          once(
              '''  body.lb-v3.page-home:not(.monde-betaillere) #home .home-dashboard > .home-card > h2,
  body.lb-v3.page-home:not(.monde-betaillere) #home .home-dashboard > .home-card .live-wall-title {
    margin: 0 0 6px !important;
    min-height: 1.16em !important;
    color: var(--lb-cyan) !important;
    font-family: var(--lb-font-display) !important;
    font-size: clamp(13px, 3.55vw, 14px) !important;
    font-weight: 800 !important;
    line-height: 1.16 !important;
    letter-spacing: 0.02em !important;
    text-align: center !important;
    text-shadow: 0 0 10px rgba(49, 231, 242, 0.2) !important;
  }
''',
              '''  body.lb-v3.page-home:not(.monde-betaillere) #home .home-dashboard > .home-card > h2,
  body.lb-v3.page-home:not(.monde-betaillere) #home .home-dashboard > .home-card .live-wall-title {
    height: var(--lb-home-title-slot) !important;
    min-height: var(--lb-home-title-slot) !important;
    margin: 0 0 5px !important;
    padding: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: var(--lb-cyan) !important;
    font-family: var(--lb-font-display) !important;
    font-size: var(--lb-home-title-size) !important;
    font-weight: 800 !important;
    line-height: var(--lb-home-title-line) !important;
    letter-spacing: 0.02em !important;
    text-align: center !important;
    text-shadow: 0 0 10px rgba(49, 231, 242, 0.2) !important;
  }
''',
              'section title hierarchy'
          )

          once(
              '''  body.lb-v3 #home .traffic-split-line {
    width: 100% !important;
    min-width: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    position: relative !important;
    z-index: 1 !important;
    font-size: clamp(11.5px, 3.15vw, 12.5px) !important;
    font-weight: 900 !important;
    line-height: 1.12 !important;
    text-align: center !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              '''  body.lb-v3 #home .traffic-split-line {
    width: 100% !important;
    min-width: 0 !important;
    min-height: var(--lb-home-text-line) !important;
    padding: 0 !important;
    overflow: hidden !important;
    position: relative !important;
    z-index: 1 !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-subtitle-size) !important;
    font-weight: 800 !important;
    line-height: var(--lb-home-text-line) !important;
    text-align: center !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              'traffic subtitle hierarchy'
          )

          once(
              '''  body.lb-v3 #home .traffic-pill {
    width: auto !important;
    min-width: min(104px, 86%) !important;
    max-width: 100% !important;
    min-height: 25px !important;
    margin: 0 !important;
    padding: 4px 7px !important;
    flex: 0 0 auto;
    overflow: hidden !important;
    position: relative !important;
    z-index: 1 !important;
    font-size: clamp(9px, 2.5vw, 10px) !important;
    line-height: 1.08 !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              '''  body.lb-v3 #home .traffic-pill {
    width: auto !important;
    min-width: min(104px, 86%) !important;
    max-width: 100% !important;
    height: var(--lb-home-control-h) !important;
    min-height: var(--lb-home-control-h) !important;
    margin: 0 !important;
    padding: 4px 7px !important;
    flex: 0 0 auto;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    position: relative !important;
    z-index: 1 !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-control-size) !important;
    font-weight: 800 !important;
    line-height: var(--lb-home-control-line) !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              'traffic control hierarchy'
          )

          once(
              '''  body.lb-v3 #home .home-quick-presets__btn {
    width: 100% !important;
    min-width: 0 !important;
    min-height: 25px !important;
    padding: 4px 3px !important;
    overflow: hidden !important;
    font-size: clamp(10px, 2.75vw, 11px) !important;
    line-height: 1.08 !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              '''  body.lb-v3 #home .home-quick-presets__btn {
    width: 100% !important;
    min-width: 0 !important;
    height: var(--lb-home-control-h) !important;
    min-height: var(--lb-home-control-h) !important;
    padding: 4px 5px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-control-size) !important;
    font-weight: 700 !important;
    line-height: var(--lb-home-control-line) !important;
    text-overflow: ellipsis !important;
    white-space: nowrap !important;
  }
''',
              'quick control hierarchy'
          )

          once(
              '''  body.lb-v3 #home #homePunctCardTitle {
    margin: 0 0 2px !important;
    font-size: clamp(13px, 3.55vw, 14px) !important;
  }

''',
              '',
              'remove punctuality title exception'
          )

          once(
              '''  body.lb-v3 #home .home-punct-mini-label {
    bottom: 0 !important;
    font-size: 0.58rem !important;
  }
''',
              '''  body.lb-v3 #home .home-punct-mini-label {
    bottom: 0 !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-meta-size) !important;
    line-height: var(--lb-home-meta-line) !important;
  }
''',
              'punctuality meta hierarchy'
          )

          once(
              '''  body.lb-v3 #home .lb-community-btn {
    width: 100% !important;
    min-width: 0 !important;
    min-height: 32px !important;
    padding: 5px 7px !important;
    font-size: 0.7rem !important;
  }
''',
              '''  body.lb-v3 #home .lb-community-btn {
    width: 100% !important;
    min-width: 0 !important;
    height: var(--lb-home-action-h) !important;
    min-height: var(--lb-home-action-h) !important;
    padding: 5px 7px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-control-size) !important;
    font-weight: 700 !important;
    line-height: var(--lb-home-control-line) !important;
  }
''',
              'community action hierarchy'
          )

          once(
              '''  body.lb-v3 #home .live-wall-item,
  body.lb-v3 #home .live-wall-item--home,
  body.lb-v3 #home .live-wall-item-text,
  body.lb-v3 #home .live-wall-empty {
    font-size: clamp(0.67rem, 2.75vw, 0.78rem) !important;
    line-height: 1.18 !important;
  }

  body.lb-v3 #home .live-wall-meta,
  body.lb-v3 #home .live-wall-inline-meta {
    font-size: 0.7rem !important;
  }
''',
              '''  body.lb-v3 #home .live-wall-item,
  body.lb-v3 #home .live-wall-item--home,
  body.lb-v3 #home .live-wall-item-text,
  body.lb-v3 #home .live-wall-empty {
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-text-size) !important;
    line-height: var(--lb-home-text-line) !important;
  }

  body.lb-v3 #home .live-wall-meta,
  body.lb-v3 #home .live-wall-inline-meta {
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-meta-size) !important;
    line-height: var(--lb-home-meta-line) !important;
  }
''',
              'community text hierarchy'
          )

          once(
              '''  body.lb-v3 #home .live-wall-form button {
    width: auto !important;
    min-width: 72px !important;
    min-height: 34px !important;
    height: 34px !important;
    padding: 5px 8px !important;
    font-size: 0.7rem !important;
  }
''',
              '''  body.lb-v3 #home .live-wall-form button {
    width: auto !important;
    min-width: 72px !important;
    min-height: 34px !important;
    height: 34px !important;
    padding: 5px 8px !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-control-size) !important;
    font-weight: 700 !important;
    line-height: var(--lb-home-control-line) !important;
  }
''',
              'community send button hierarchy'
          )

          once(
              '''  body.lb-v3 #home .home-fav-train {
    font-size: clamp(12px, 3.1vw, 13px) !important;
    line-height: 1.12 !important;
  }

  body.lb-v3 #home #homeFavSlot .home-fav-train-no {
    font-size: clamp(12px, 3.15vw, 13px) !important;
    line-height: 1.12 !important;
  }

  body.lb-v3 #home #homeFavSlot :is(.home-fav-route, .home-fav-time, .home-fav-meta) {
    font-size: clamp(11.5px, 3vw, 12.5px) !important;
    line-height: 1.18 !important;
  }
''',
              '''  body.lb-v3 #home .home-fav-train,
  body.lb-v3 #home #homeFavSlot .home-fav-train-no {
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-subtitle-size) !important;
    font-weight: 800 !important;
    line-height: var(--lb-home-text-line) !important;
  }

  body.lb-v3 #home #homeFavSlot :is(.home-fav-route, .home-fav-time, .home-fav-meta) {
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-text-size) !important;
    line-height: var(--lb-home-text-line) !important;
  }
''',
              'favorite text hierarchy'
          )

          once(
              '''  body.lb-v3 #home .home-fav-pill,
  body.lb-v3 #home .fav-state-badge,
  body.lb-v3 #home .home-fav-badge {
    max-width: 66px !important;
    padding: 3px 5px !important;
    font-size: clamp(8.5px, 2.25vw, 9.5px) !important;
    line-height: 1.05 !important;
  }
''',
              '''  body.lb-v3 #home .home-fav-pill,
  body.lb-v3 #home .fav-state-badge,
  body.lb-v3 #home .home-fav-badge {
    max-width: 66px !important;
    min-height: 24px !important;
    padding: 3px 5px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-family: var(--lb-font-body) !important;
    font-size: var(--lb-home-badge-size) !important;
    font-weight: 800 !important;
    line-height: var(--lb-home-badge-line) !important;
    text-align: center !important;
  }
''',
              'favorite badge hierarchy'
          )

          # On very narrow phones, keep the same control typography. Width may shrink,
          # but the hierarchy itself must not change font size independently.
          once(
              '''  body.lb-v3 #home .traffic-pill {
    min-width: 88px !important;
    font-size: 0.59rem !important;
  }
''',
              '''  body.lb-v3 #home .traffic-pill {
    min-width: 88px !important;
  }
''',
              'remove narrow traffic font exception'
          )

          if text == original:
              raise SystemExit('No CSS change produced')

          # Lightweight structural guards: keep this a CSS-only, in-place refactor.
          if text.count('{') != text.count('}'):
              raise SystemExit('CSS brace count is unbalanced')
          if '@media' not in text or 'body.lb-v3 #home' not in text:
              raise SystemExit('Unexpected CSS structure after edit')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Show and validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- assets/lb-mobile-v4.css
          test "$(git diff --name-only | grep -v '^.github/workflows/oneoff-mobile-home-typography.yml$' | sort -u)" = "assets/lb-mobile-v4.css"

      - name: Commit clean result and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-mobile-home-typography.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lb-mobile-v4.css .github/workflows/oneoff-mobile-home-typography.yml
          git diff --cached --check
          git commit -m "refactor: harmonise mobile home typography"
          git push origin HEAD:fix/mobile-home-typography-20260831
