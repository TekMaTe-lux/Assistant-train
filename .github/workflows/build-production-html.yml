name: Build production HTML

on:
  push:
    branches:
      - main
    paths:
      - "_source/index.html"
      - "_source/build_prod.py"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minified index
        run: python3 _source/build_prod.py

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build production index [skip ci]"
          git push
