name: Temp publish gare ready v3
on:
  push:
    paths:
      - '.github/workflows/temp-publish-gare-ready-v3.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump wrapper and PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='carte.html?embed=1&v=20260917-gare-cycle-v2'
          new='carte.html?embed=1&v=20260917-gare-ready-v3'
          if old not in s:
              raise SystemExit('expected map wrapper version not found')
          p.write_text(s.replace(old,new,1))
          p=Path('service-worker.js')
          s=p.read_text()
          old="const CACHE_VERSION = 'v60';"
          new="const CACHE_VERSION = 'v61';"
          if old not in s:
              raise SystemExit('expected PWA version not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check service-worker.js
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'PWA: publish Luxembourg station ready handshake'
          git rm .github/workflows/temp-publish-gare-ready-v3.yml
          git commit -m 'Cleanup temporary station publish workflow'
          git push
