name: Apply SNCF priority and mobile button fix

on:
  push:
    paths:
      - '.github/workflows/apply-sncf-priority-mobile-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply targeted patch
        run: python3 .github/scripts/fix_sncf_priority_mobile_button.py

      - name: Validate
        run: |
          git diff --check
          node --check assets/lb-mobile-v4.js
          grep -n "hasExplicitSncfRealtime" index.html
          grep -n "const label = \"Générer le tableau\"" assets/lb-mobile-v4.js
          grep -n "bouton Générer le tableau réellement centré" assets/lb-mobile-v4.css
          grep -n "lb-mobile-v4.css?v=11" index.html
          grep -n "lb-mobile-v4.js?v=6" index.html
          git diff --stat -- index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css

      - name: Commit
        run: |
          test -n "$(git status --porcelain -- index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-mobile-v4.js assets/lb-mobile-v4.css
          git commit -m "fix: keep SNCF amended times and center mobile generate action"
          git push origin HEAD:main
