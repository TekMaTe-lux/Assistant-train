name: Inspect GTFS terminal rendering

on:
  push:
    paths:
      - '.github/workflows/inspect-gtfs-terminal.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show relevant code
        run: |
          line=$(grep -n "function applyRetardsFromGTFS" index.html | head -1 | cut -d: -f1)
          echo "applyRetardsFromGTFS line=$line"
          start=$((line+70)); end=$((line+180)); sed -n "${start},${end}p" index.html
          echo "--- loadTrains mobile rules ---"
          grep -n -A20 -B10 "#loadTrains" assets/lb-mobile-v4.css
          echo "--- add button rules ---"
          grep -n -A12 -B8 -E "preset-btn--add|lb-prefs-add" assets/lb-design-system-v3.css assets/lb-mobile-v4.css || true
