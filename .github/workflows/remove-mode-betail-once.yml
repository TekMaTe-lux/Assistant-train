name: Remove Mode Betail once

on:
  push:
    paths:
      - '.github/workflows/remove-mode-betail-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Mode Betail
        run: python3 tools/remove_mode_betail_once.py

      - name: Validate sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -RniE 'monde-betaillere|#monde-betaillere-btn|labetaillere_monde_betaillere_enabled' index.html assets config service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          for i, block in enumerate(blocks):
              if not block.strip():
                  continue
              path = Path('/tmp') / f'lb-inline-{i}.js'
              path.write_text(block, encoding='utf-8')
              check = subprocess.run(['node', '--check', str(path)], capture_output=True, text=True)
              if check.returncode:
                  print(check.stderr)
                  sys.exit(check.returncode)
          print(f'Inline JS OK: {len(blocks)} scripts')
          PY
          node --check service-worker.js

      - name: Commit cleanup and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/remove_mode_betail_once.py .github/workflows/remove-mode-betail-once.yml
          git add -A
          git config user.name 'La Betaillere maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Supprime le Mode Bétail et simplifie les styles'
          git push origin HEAD:main
