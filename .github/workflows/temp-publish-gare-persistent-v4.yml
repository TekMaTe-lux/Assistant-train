name: Temp publish gare persistent v4
on:
  push:
    paths:
      - '.github/workflows/temp-publish-gare-persistent-v4.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='carte.html?embed=1&v=20260917-gare-ready-v3'
          new='carte.html?embed=1&v=20260917-gare-persistent-v4'
          if old not in s: raise SystemExit('index carte version not found')
          p.write_text(s.replace(old,new,1))
          sw=Path('service-worker.js')
          t=sw.read_text()
          if "const CACHE_VERSION = 'v61';" not in t: raise SystemExit('sw v61 not found')
          sw.write_text(t.replace("const CACHE_VERSION = 'v61';","const CACHE_VERSION = 'v62';",1))
          PY
      - name: Validate
        run: |
          node --check service-worker.js
          grep -F 'gare-persistent-v4' index.html
          grep -F "CACHE_VERSION = 'v62'" service-worker.js
      - name: Commit patch
        run: |
          git config user.name 'TekMaTe-lux'
          git config user.email 'm.fresse54@gmail.com'
          git add index.html service-worker.js
          git commit -m 'Fix Luxembourg station repeated opening with persistent iframe'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/temp-publish-gare-persistent-v4.yml
          git commit -m 'Remove temporary station publish workflow'
          git push
