name: Apply partial table and mobile button fixes

on:
  push:
    paths:
      - '.github/workflows/lb-fix-partial-table-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply targeted patch
        run: python3 .github/scripts/patch_partial_table_mobile.py

      - name: Validate changes
        run: |
          git diff --check
          grep -n "TERMINUS EXCEPTIONNEL</span>" index.html | head
          grep -n "centrage bouton Générer le tableau" assets/lb-mobile-v4.css
          git diff --stat -- index.html assets/lb-mobile-v4.css

      - name: Commit patch
        run: |
          test -n "$(git status --porcelain -- index.html assets/lb-mobile-v4.css)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-mobile-v4.css
          git commit -m "fix: show partial terminus in table and center mobile action"
          git push origin HEAD:main
