name: Patch dynamic table train colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-table-train-colors-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch train number colors
        run: python3 .github/patch-table-train-colors-v1.py

      - name: Run focused regressions
        run: |
          node --test tests/table-train-composition-colors.test.js
          node --test tests/home-favorites-composition.test.js
          node --test tests/live-partial-cancellation.test.js
          git diff --check

      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-v4-live-preview.css tests/table-train-composition-colors.test.js
          if git diff --cached --quiet; then
            echo "No application change to commit"
            exit 0
          fi
          git commit -m "Fix dynamic table train composition colors"
          git push origin main
