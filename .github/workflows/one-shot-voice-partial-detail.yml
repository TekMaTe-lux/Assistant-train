name: One-shot Voix partial detail patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-voice-partial-detail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harmonize Voix du betail partial-cancellation detail
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          source = index.read_text(encoding='utf-8')

          helper_marker = "  async function renderTrainDetail(trainNumber){"
          if helper_marker not in source:
              raise SystemExit('renderTrainDetail marker missing')

          helper = r'''
  // Voix du bétail : même lecture du parcours réellement assuré que la fiche unifiée.
  // Les données officielles SNCF restent distinctes des signalements voyageurs.
  function normalizeVoiceOfficialStopKey(value){
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '');
  }

  function getVoiceOfficialStopRows(train){
    const hubStops = Array.isArray(train?.sncfJourney?.stop_times)
      ? train.sncfJourney.stop_times
      : [];
    if (hubStops.length) return hubStops;
    return Array.isArray(train?.raw?.stop_times) ? train.raw.stop_times : [];
  }

  function collectVoiceOfficialImpacts(train){
    const hubData = train?.sncfHubData || null;
    const impacted = {};
    if (hubData?.impacted && typeof hubData.impacted === 'object') {
      Object.assign(impacted, hubData.impacted);
    }
    (Array.isArray(hubData?.disruptions) ? hubData.disruptions : []).forEach((disruption)=>{
      (Array.isArray(disruption?.impacted_objects) ? disruption.impacted_objects : []).forEach((object)=>{
        (Array.isArray(object?.impacted_stops) ? object.impacted_stops : []).forEach((stop)=>{
          const stopId = String(stop?.stop_point?.id || stop?.stop_id || '').trim();
          if (stopId) impacted[stopId] = stop;
        });
      });
    });
    return impacted;
  }

  function voiceOfficialStopName(stop){
    return String(stop?.stop_point?.name || stop?.stop_name || stop?.name || '').trim();
  }

  function findVoiceOfficialStop(row, officialStops){
    const target = normalizeVoiceOfficialStopKey(row?.name);
    if (!target) return null;
    return (Array.isArray(officialStops) ? officialStops : []).find((stop)=>
      normalizeVoiceOfficialStopKey(voiceOfficialStopName(stop)) === target
    ) || null;
  }

  function findVoiceOfficialImpact(row, officialStop, impacted){
    const stopId = String(officialStop?.stop_point?.id || officialStop?.stop_id || '').trim();
    if (stopId && impacted?.[stopId]) return impacted[stopId];
    const idDigits = stopId.match(/(\d{8})/)?.[1] || '';
    const target = normalizeVoiceOfficialStopKey(row?.name || voiceOfficialStopName(officialStop));
    const match = Object.entries(impacted || {}).find(([impactId, impact])=>{
      if (idDigits && String(impactId).includes(idDigits)) return true;
      const impactStopId = String(impact?.stop_point?.id || impact?.stop_id || '');
      if (idDigits && impactStopId.includes(idDigits)) return true;
      return target && normalizeVoiceOfficialStopKey(voiceOfficialStopName(impact)) === target;
    });
    return match?.[1] || officialStop || null;
  }

  function voiceOfficialLegDeleted(impact, leg, officialStop){
    for (const source of [impact, officialStop]) {
      if (!source || typeof source !== 'object') continue;
      const status = String(source?.[`${leg}_status`] || '').toLowerCase();
      if (status) return status === 'deleted';
      const relationship = String(source?.schedule_relationship || '').toLowerCase();
      if (source?.skipped === true || relationship === 'skipped' || relationship === 'deleted') return true;
    }
    for (const source of [impact, officialStop]) {
      if (!source || typeof source !== 'object') continue;
      if (source?.[`amended_${leg}_time`]) return false;
    }
    for (const source of [impact, officialStop]) {
      if (!source || typeof source !== 'object') continue;
      const scheduled = source?.[`base_${leg}_time`] || source?.[`${leg}_time`];
      if (String(source?.stop_time_effect || '').toLowerCase() === 'deleted' && scheduled) return true;
    }
    return false;
  }

  function voiceOfficialHasLeg(officialStop, leg, index, total){
    if (officialStop && typeof officialStop === 'object') {
      const raw = officialStop?.[`base_${leg}_time`]
        || officialStop?.[`amended_${leg}_time`]
        || officialStop?.[`${leg}_time`];
      if (raw) return true;
    }
    return leg === 'arrival' ? index > 0 : index < total - 1;
  }

  function voiceCanceledStopKeys(train){
    const raw = train?.raw || {};
    const names = [
      ...(Array.isArray(raw?.canceled_stops) ? raw.canceled_stops : []),
      ...(Array.isArray(raw?.canceledStops) ? raw.canceledStops : [])
    ];
    return new Set(names.map((stop)=>
      normalizeVoiceOfficialStopKey(stop?.name || stop?.stop_name || stop)
    ).filter(Boolean));
  }

  function applyVoiceOfficialServicePattern(rows, train){
    if (!Array.isArray(rows) || !rows.length || !train) return rows || [];
    const officialStops = getVoiceOfficialStopRows(train);
    const impacted = collectVoiceOfficialImpacts(train);
    const canceledStopKeys = voiceCanceledStopKeys(train);
    const fullCancellation = train.statusClass === 'cancel';

    const enriched = rows.map((row, index)=>{
      const officialStop = findVoiceOfficialStop(row, officialStops);
      const impact = findVoiceOfficialImpact(row, officialStop, impacted);
      let arrivalDeleted = voiceOfficialLegDeleted(impact, 'arrival', officialStop);
      let departureDeleted = voiceOfficialLegDeleted(impact, 'departure', officialStop);
      if (canceledStopKeys.has(normalizeVoiceOfficialStopKey(row?.name))) {
        arrivalDeleted = true;
        departureDeleted = true;
      }
      const hasArrival = voiceOfficialHasLeg(officialStop, 'arrival', index, rows.length);
      const hasDeparture = voiceOfficialHasLeg(officialStop, 'departure', index, rows.length);
      const arrivalAvailable = hasArrival && !arrivalDeleted;
      const departureAvailable = hasDeparture && !departureDeleted;
      return {
        ...row,
        officialStop,
        officialImpact: impact,
        arrivalDeleted,
        departureDeleted,
        arrivalAvailable,
        departureAvailable,
        officialDeleted: fullCancellation || (!arrivalAvailable && !departureAvailable)
      };
    });

    if (fullCancellation) return enriched;

    let firstIndex = enriched.findIndex((row)=> row.departureAvailable);
    let lastIndex = -1;
    for (let index = enriched.length - 1; index >= 0; index -= 1) {
      if (enriched[index].arrivalAvailable) {
        lastIndex = index;
        break;
      }
    }
    if (firstIndex < 0) firstIndex = enriched.findIndex((row)=> !row.officialDeleted);
    if (lastIndex < 0) {
      for (let index = enriched.length - 1; index >= 0; index -= 1) {
        if (!enriched[index].officialDeleted) {
          lastIndex = index;
          break;
        }
      }
    }
    if (firstIndex < 0 || lastIndex < 0 || firstIndex > lastIndex) return enriched;

    return enriched.map((row, index)=>({
      ...row,
      officialDeleted: row.officialDeleted || index < firstIndex || index > lastIndex,
      officialNewOrigin: firstIndex > 0 && index === firstIndex,
      officialNewTerminus: lastIndex < enriched.length - 1 && index === lastIndex
    }));
  }

'''
          if 'function applyVoiceOfficialServicePattern(rows, train)' not in source:
              source = source.replace(helper_marker, helper + helper_marker, 1)

          # Keep the SNCF HUB journey on the LIVE train object so the detail modal
          # can render the exact deleted legs instead of only the global status.
          hydrate_start = source.index('  async function hydrateLiveSncfViaHub(sourceTrains){')
          hydrate_end = source.index('  function lbCompactLiveTrainName', hydrate_start)
          hydrate = source[hydrate_start:hydrate_end]
          hydrate_needle = "      if (liveTrain){\n"
          if 'liveTrain.sncfHubData = response.data;' not in hydrate:
              if hydrate.count(hydrate_needle) != 1:
                  raise SystemExit('hydrate liveTrain block not unique')
              hydrate = hydrate.replace(
                  hydrate_needle,
                  hydrate_needle
                  + "        liveTrain.sncfHubData = response.data;\n"
                  + "        liveTrain.sncfJourney = finalInfo.train || info.train || null;\n",
                  1
              )
              source = source[:hydrate_start] + hydrate + source[hydrate_end:]

          detail_start = source.index(helper_marker)
          detail_end = source.index('  function signalTrainOptionsSignature', detail_start)
          detail = source[detail_start:detail_end]

          guard = "    if (!title || !route || !stopsEl || !train) return;\n"
          hydration = """    if (!title || !route || !stopsEl || !train) return;

    // Si le HUB n'a pas encore hydraté la carte LIVE, on le fait au clic :
    // aucune différence de vérité entre la carte LIVE et la fiche Recherche.
    if (!train.sncfJourney && typeof window.fetchVehicleJourneyViaHub === 'function') {
      try { await hydrateLiveSncfViaHub([train]); }
      catch (err) { console.warn('[Voix du bétail] détail SNCF indisponible', err?.message || err); }
    }
"""
          if 'détail SNCF indisponible' not in detail:
              if detail.count(guard) != 1:
                  raise SystemExit('renderTrainDetail guard not unique')
              detail = detail.replace(guard, hydration, 1)

          old_rows = """    const stopRows = Array.isArray(info?.stopRows) && info.stopRows.length
      ? info.stopRows
      : stops.map((name)=>({ name, time:'—' }));
"""
          new_rows = """    const baseStopRows = Array.isArray(info?.stopRows) && info.stopRows.length
      ? info.stopRows
      : stops.map((name)=>({ name, time:'—' }));
    const stopRows = applyVoiceOfficialServicePattern(baseStopRows, train);
"""
          if 'const baseStopRows =' not in detail:
              if detail.count(old_rows) != 1:
                  raise SystemExit('stopRows block not found exactly once')
              detail = detail.replace(old_rows, new_rows, 1)

          row_name = "      const stopName = row?.name || '';\n"
          flags = """      const stopName = row?.name || '';
      const officialDeleted = !!row?.officialDeleted;
      const officialNewOrigin = !!row?.officialNewOrigin;
      const officialNewTerminus = !!row?.officialNewTerminus;
"""
          if 'const officialDeleted = !!row?.officialDeleted;' not in detail:
              if detail.count(row_name) != 1:
                  raise SystemExit('stopName line not unique in detail')
              detail = detail.replace(row_name, flags, 1)

          delay_if = "      if (hasGtfsDelay){\n"
          deleted_if = """      if (officialDeleted){
        timeClass = 'lb-train-stop-time is-cancel';
        timeHtml = `<span class=\"actual\">${safeEscape(baseTime)}</span>`;
      } else if (hasGtfsDelay){
"""
          if "if (officialDeleted){" not in detail:
              if detail.count(delay_if) != 1:
                  raise SystemExit('delay branch not unique')
              detail = detail.replace(delay_if, deleted_if, 1)

          chips_marker = "      const chipsList = [];\n"
          official_chips = """      const chipsList = [];
      if (officialDeleted) {
        chipsList.push('<span class=\"lb-stop-chip lb-stop-chip--suppression\" title=\"Donnée officielle SNCF\">SUPPRIMÉ · arrêt non desservi</span>');
      } else if (officialNewOrigin) {
        chipsList.push('<span class=\"lb-stop-chip lb-stop-chip--official-partial\" title=\"Donnée officielle SNCF\">DÉPART EXCEPTIONNEL</span>');
      } else if (officialNewTerminus) {
        chipsList.push('<span class=\"lb-stop-chip lb-stop-chip--official-partial\" title=\"Donnée officielle SNCF\">TERMINUS EXCEPTIONNEL</span>');
      }
"""
          if 'lb-stop-chip--official-partial' not in detail:
              if detail.count(chips_marker) != 1:
                  raise SystemExit('chips marker not unique')
              detail = detail.replace(chips_marker, official_chips, 1)

          return_marker = "      return `<article class=\"lb-train-stop-item\"><div class=\"lb-train-stop-head\">"
          return_replacement = """      const officialRowClass = officialDeleted
        ? ' is-official-cancel'
        : ((officialNewOrigin || officialNewTerminus) ? ' is-official-endpoint' : '');
      return `<article class=\"lb-train-stop-item${officialRowClass}\"><div class=\"lb-train-stop-head\">"""
          if 'const officialRowClass = officialDeleted' not in detail:
              if detail.count(return_marker) != 1:
                  raise SystemExit('detail article return marker not unique')
              detail = detail.replace(return_marker, return_replacement, 1)

          source = source[:detail_start] + detail + source[detail_end:]

          # Cache-bust the legacy sheet because it receives new official-state styles.
          source = source.replace('./assets/lb-legacy.css?v=4', './assets/lb-legacy.css?v=5', 1)
          index.write_text(source, encoding='utf-8')

          css_path = Path('assets/lb-legacy.css')
          css = css_path.read_text(encoding='utf-8')
          if '.lb-stop-chip--official-partial{' not in css:
              css_marker = """.lb-stop-chip--suppression{
  color:#ff4d6d;
  border-color:rgba(255,77,109,.62);
  background:rgba(115,28,45,.25);
}
"""
              css_insert = css_marker + """.lb-stop-chip--official-partial{
  color:#54e6a4;
  border-color:rgba(84,230,164,.62);
  background:rgba(20,104,75,.24);
}
"""
              if css.count(css_marker) != 1:
                  raise SystemExit('suppression chip CSS marker not unique')
              css = css.replace(css_marker, css_insert, 1)

          if '.lb-train-stop-item.is-official-cancel .lb-train-stop-name' not in css:
              name_marker = ".lb-train-stop-name{ font-weight:800; font-size:.78rem; color:#dcf9ff; }\n"
              name_insert = name_marker + """.lb-train-stop-item.is-official-cancel .lb-train-stop-name{
  color:#8f9aa1;
  text-decoration:line-through;
  text-decoration-color:#8f9aa1;
}
.lb-train-stop-item.is-official-endpoint{
  border-color:rgba(84,230,164,.34);
  box-shadow:inset 0 0 0 1px rgba(84,230,164,.06);
}
"""
              if css.count(name_marker) != 1:
                  raise SystemExit('train stop name CSS marker not unique')
              css = css.replace(name_marker, name_insert, 1)
          css_path.write_text(css, encoding='utf-8')

          tests_path = Path('tests/live-partial-cancellation.test.js')
          tests = tests_path.read_text(encoding='utf-8')
          if "Voix detail renders official deleted stops" not in tests:
              tests += r'''

test('Voix detail renders official deleted stops and exceptional endpoints', () => {
  const hydrate = between('async function hydrateLiveSncfViaHub(sourceTrains)', 'function lbCompactLiveTrainName');
  assert.match(hydrate, /sncfHubData = response\.data/);
  assert.match(hydrate, /sncfJourney = finalInfo\.train/);

  const helper = between('function applyVoiceOfficialServicePattern(rows, train)', 'async function renderTrainDetail(trainNumber)');
  assert.match(helper, /arrivalDeleted/);
  assert.match(helper, /departureDeleted/);
  assert.match(helper, /officialNewOrigin/);
  assert.match(helper, /officialNewTerminus/);

  const detail = between('async function renderTrainDetail(trainNumber)', 'function signalTrainOptionsSignature');
  assert.match(detail, /SUPPRIMÉ · arrêt non desservi/);
  assert.match(detail, /DÉPART EXCEPTIONNEL/);
  assert.match(detail, /TERMINUS EXCEPTIONNEL/);
  assert.match(detail, /if \(officialDeleted\)/);
  assert.match(css, /\.lb-stop-chip--official-partial/);
  assert.match(css, /\.lb-train-stop-item\.is-official-cancel/);
});
'''
              tests_path.write_text(tests, encoding='utf-8')

      - name: Run focused tests
        run: node --test tests/live-partial-cancellation.test.js

      - name: Commit patch
        run: |
          git config user.name "La Betaillere patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/lb-legacy.css tests/live-partial-cancellation.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Harmonize Voix partial cancellation details"
          git push origin main
