name: One-off Info trafic wrap fix

on:
  push:
    branches:
      - fix/info-trafic-wrap-20260831

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/info-trafic-wrap-20260831
          fetch-depth: 0

      - name: Apply Info trafic wrap fix
        run: python3 .github/scripts/oneoff_info_traffic_wrap.py

      - name: Validate CSS-only diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "assets/lb-mobile-v4.css"
          grep -q -- 'white-space: normal !important;' assets/lb-mobile-v4.css
          grep -q -- 'min-height: 32px !important;' assets/lb-mobile-v4.css
          grep -q -- 'width: 96px !important;' assets/lb-mobile-v4.css

      - name: Commit clean result and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-info-traffic-wrap.yml
          rm -f .github/scripts/oneoff_info_traffic_wrap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lb-mobile-v4.css .github/workflows/oneoff-info-traffic-wrap.yml .github/scripts/oneoff_info_traffic_wrap.py
          git diff --cached --check
          git commit -m "Corrige le retour à la ligne des états trafic"
          git push origin HEAD:fix/info-trafic-wrap-20260831
