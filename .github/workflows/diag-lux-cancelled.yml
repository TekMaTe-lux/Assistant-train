name: Diagnose Luxembourg cancelled trains
on:
  push:
    paths:
      - '.github/workflows/diag-lux-cancelled.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose live feed and cancellation logic
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://vps.labetaillere.fr/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html'
          FEED='https://vps.labetaillere.fr/gtfs/lux_station_live.json'
          curl -fsSL "$PAGE" -o /tmp/lux.html
          curl -fsSL "$FEED" -o /tmp/feed.json
          python3 - <<'PY' > tmp-lux-cancelled-diag.txt
          from pathlib import Path
          import json,re
          s=Path('/tmp/lux.html').read_text(encoding='utf-8', errors='replace')
          lines=s.splitlines()
          data=json.loads(Path('/tmp/feed.json').read_text(encoding='utf-8'))
          print('=== TARGET ROWS ===')
          for mode in ('arrivals','departures'):
              for i,row in enumerate(data.get(mode,[])):
                  if str(row.get('number','')) in {'88813','88748'} or '88813' in json.dumps(row) or '88748' in json.dumps(row):
                      keep={k:row.get(k) for k in ['id','journeyRef','mode','type','number','train','place','origin','destination','planned','realtime','track','date','cancelled','source','_serverHistorical','_serverLastSeenAt'] if k in row}
                      print(mode,i,json.dumps(keep,ensure_ascii=False,sort_keys=True))
          print('\n=== FUNCTIONS / CACHE ===')
          starts=[]
          for i,l in enumerate(lines,1):
              if re.search(r'function\s+(cancelledFor|stableMovementKey)\b',l) or re.search(r'const\s+(cancelledFor|stableMovementKey)\s*=',l):
                  starts.append(i)
          for i in starts:
              a=max(1,i-2); b=min(len(lines),i+45)
              print(f'\n--- {a}-{b} ---')
              for n in range(a,b+1): print(f'{n:05d}: {lines[n-1]}')
          for needle in ['cancelled:cancelledFor(r)','MOVEMENT_CACHE.set(key','EVENTS=EVENTS.filter(e=>!e.cancelled)','const cancelled=fresh.filter']:
              for i,l in enumerate(lines,1):
                  if needle in l:
                      a=max(1,i-12); b=min(len(lines),i+22)
                      print(f'\n--- around {needle} {a}-{b} ---')
                      for n in range(a,b+1): print(f'{n:05d}: {lines[n-1]}')
                      break
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-lux-cancelled-diag.txt
          git commit -m 'Refresh temporary Luxembourg cancellation diagnostic' || exit 0
          git push
