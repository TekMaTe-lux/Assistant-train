name: V4 smoke tests

on:
  push:
    branches:
      - refonte-v4-command-center
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/lb-data-client-v4.js
          node --check assets/lb-train-components-v4.js
          node --check assets/lb-v4-command-center.js
          node --check assets/lb-command-center-home-v4.js
          node --check v4/data-bridge.js
          node --check backend/data-engine-v4/server.mjs
      - name: Check Python Data Engine
        run: |
          python3 -m py_compile backend/data-engine-v4/server.py
          python3 backend/data-engine-v4/server.py --fixture-test
      - name: Check installers
        run: |
          bash -n scripts/install-v4-preview.sh
          bash -n scripts/install-v4-data-engine.sh
      - name: Check required V4 assets
        run: |
          test -s assets/lb-v4-tokens.css
          test -s assets/lb-v4-command-center.css
          test -s assets/lb-train-components-v4.css
          test -s assets/lb-command-center-home-v4.css
          test -s assets/lb-v4-icons.svg
          test -s backend/data-engine-v4/server.py
          test -s v4/data-bridge.js
          test -s docs/REFONTE_V4_COMMAND_CENTER.md
