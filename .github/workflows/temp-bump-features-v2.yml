name: Temp bump French sheet loader asset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-bump-features-v2.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump feature asset and PWA cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes=[
            ('index.html','./assets/lb-index-features.js?v=1','./assets/lb-index-features.js?v=2'),
            ('service-worker.js','./assets/lb-index-features.js?v=1','./assets/lb-index-features.js?v=2'),
            ('service-worker.js',"const CACHE_VERSION = 'v58';","const CACHE_VERSION = 'v59';"),
          ]
          for filename,old,new in changes:
              p=Path(filename); s=p.read_text()
              if old not in s: raise SystemExit(f'missing {old} in {filename}')
              p.write_text(s.replace(old,new,1))
          PY
          node --check service-worker.js
          grep -F './assets/lb-index-features.js?v=2' index.html
          grep -F './assets/lb-index-features.js?v=2' service-worker.js
          grep -F "const CACHE_VERSION = 'v59';" service-worker.js
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/temp-bump-features-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js .github/workflows/temp-bump-features-v2.yml
          git commit -m 'PWA: publish French train sheet loader v2'
          git push
