name: One-shot fix signal station

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-signal-station.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve selected station when signal form refreshes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = "const selectedStation = String(stationSelect.value || '').trim();"

          start_token = "  function updateSignalStationOptions(){"
          end_token = "\n\n  async function publishSignal"
          start = text.find(start_token)
          if start < 0:
              raise SystemExit('updateSignalStationOptions() not found; refusing to modify index.html.')
          end = text.find(end_token, start)
          if end < 0:
              raise SystemExit('End of updateSignalStationOptions() not found; refusing to modify index.html.')

          block = text[start:end]
          if marker not in block:
              guard = "    if (!trainSelect || !stationSelect) return;\n"
              old_tail = "    if (options.length === 1) stationSelect.value = options[0];"
              if guard not in block or old_tail not in block:
                  raise SystemExit('Expected station selector structure not found; refusing to modify index.html.')

              block = block.replace(
                  guard,
                  guard + "    const selectedStation = String(stationSelect.value || '').trim();\n",
                  1,
              )
              block = block.replace(
                  old_tail,
                  "    if (selectedStation && options.some((name)=> String(name) === selectedStation)){\n"
                  "      stationSelect.value = selectedStation;\n"
                  "    } else if (options.length === 1){\n"
                  "      stationSelect.value = options[0];\n"
                  "    }",
                  1,
              )
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')
              print('Station persistence fix applied.')
          else:
              print('Fix already present.')

          updated = path.read_text(encoding='utf-8')
          fixed_start = updated.find(start_token)
          fixed_end = updated.find(end_token, fixed_start)
          fixed_block = updated[fixed_start:fixed_end]
          assert marker in fixed_block, 'Fix marker missing after update'
          assert "stationSelect.value = selectedStation;" in fixed_block, 'Station restoration line missing'
          assert "else if (options.length === 1)" in fixed_block, 'Single-station fallback missing'
          PY

          rm -f .github/workflows/one-shot-fix-signal-station.yml
          git diff --check

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-fix-signal-station.yml
          git commit -m "Fix station persistence in live report form"
          git push origin HEAD:main
