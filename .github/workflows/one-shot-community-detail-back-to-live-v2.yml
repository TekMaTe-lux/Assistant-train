name: Patch LIVE detail return

on:
  push:
    paths:
      - '.github/workflows/one-shot-community-detail-back-to-live-v2.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch modal return logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "    if (returningToSignal) modal.dataset.lbReturnModal = 'lbSignalModal';"
          insert = """    const returningToLive = id === 'lbTrainDetailModal'
              && $id('lbLiveModal')?.classList.contains('is-open');
            if (returningToSignal) modal.dataset.lbReturnModal = 'lbSignalModal';
            if (returningToLive) modal.dataset.lbReturnModal = 'lbLiveModal';"""
          if "const returningToLive = id === 'lbTrainDetailModal'" not in s:
              count = s.count(marker)
              if count < 1:
                  raise SystemExit('return marker missing')
              s = s.replace(marker, insert)
              p.write_text(s, encoding='utf-8')
              print(f'patched {count} occurrence(s)')
          else:
              print('return logic already present')
          PY

      - name: Verify modal return logic
        shell: bash
        run: |
          grep -q "const returningToLive = id === 'lbTrainDetailModal'" index.html
          grep -q "if (returningToLive) modal.dataset.lbReturnModal = 'lbLiveModal';" index.html
          node --test tests/live-partial-cancellation.test.js

      - name: Commit fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No application change to commit"
            exit 0
          fi
          git commit -m "Return train detail to LIVE voyageurs"
          git push
