name: Bump mobile CSS cache key

on:
  push:
    paths:
      - '.github/workflows/lb-bump-mobile-css.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Bump cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './assets/lb-mobile-v4.css?v=8'
          new = './assets/lb-mobile-v4.css?v=9'
          if old not in s:
              raise SystemExit('Référence mobile CSS v8 introuvable')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -n "lb-mobile-v4.css?v=9" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refresh mobile CSS cache key"
          git push origin HEAD:main
