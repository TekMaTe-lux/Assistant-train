name: Patch home favorites composition v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-home-favorites-compo-speed-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch home favorites
        shell: bash
        run: |
          echo '     dHlwZW9mIGxiUmVuZGVySG9tZUZhdlByZXZpZXcgPT09ICdmdW5jdGlvbiddXCBsYlJlbmRlckhvbWVGYXZQcmV2aWV3XFwoXFwpL2cpIHx8IFtdOwogIGFzc2VydC5vayhtYXRjaGVzLmxlbmd0aCA+PSAyLCAnaG9tZSBmYXZvcml0ZSByZXBhaW50IGhvb2sgbXVzdCBleGlzdCBmb3IgY2FjaGUgYW5kIG5ldHdvcmsnKTsKfSk7CicnJywgZW5jb2Rpbmc9J3V0Zi04JykK' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Run focused tests
        shell: bash
        run: |
          node --test tests/home-favorites-composition.test.js
          node --test tests/live-partial-cancellation.test.js
          git diff --check

      - name: Commit application fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-v4-live-preview.css tests/home-favorites-composition.test.js
          if git diff --cached --quiet; then
            echo "No application change to commit"
            exit 0
          fi
          git commit -m "Stabilize home favorites composition loading"
          git push origin main
