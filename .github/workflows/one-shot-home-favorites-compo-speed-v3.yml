name: Patch home favorites composition v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-home-favorites-compo-speed-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch application
        run: python3 .github/scripts/patch-home-favorites-composition-v1.py

      - name: Run focused tests
        run: |
          node --test tests/home-favorites-composition.test.js
          node --test tests/live-partial-cancellation.test.js
          git diff --check

      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/lb-v4-live-preview.css tests/home-favorites-composition.test.js
          if git diff --cached --quiet; then
            echo "No application change to commit"
            exit 0
          fi
          git commit -m "Stabilize home favorites composition loading"
          git push origin main
