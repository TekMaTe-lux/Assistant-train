<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — LIVE</title>
  <link rel="preconnect" href="https://vps.labetaillere.fr" crossorigin>
  <link rel="dns-prefetch" href="//vps.labetaillere.fr">
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611}
    .lbViewFrame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#020611}
    .lbViewFrame[hidden]{display:none!important}
    #lbMapBack{position:fixed;z-index:20;top:10px;left:10px;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 11px;border:1px solid rgba(49,231,242,.42);border-radius:10px;background:rgba(3,16,25,.94);color:#effcff;font:800 12px/1.1 Rajdhani,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.32);cursor:pointer}
    #lbMapBack[hidden]{display:none!important}
    #lbMapBack:hover,#lbMapBack:focus-visible{border-color:#31e7f2;outline:2px solid rgba(49,231,242,.22);outline-offset:2px}
    #lbMapStatus{position:fixed;z-index:15;inset:0;display:grid;place-items:center;background:#020611;color:#effcff}
    #lbMapStatus[hidden]{display:none!important}
    .lbMapStatusCard{display:flex;align-items:center;gap:10px;max-width:90%;padding:12px 15px;border:1px solid rgba(49,231,242,.28);border-radius:12px;background:rgba(3,16,25,.96);font:800 13px/1.2 Rajdhani,system-ui,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.4)}
    .lbMapSpinner{width:16px;height:16px;border:2px solid rgba(94,232,245,.2);border-top-color:#5ee8f5;border-radius:50%;animation:lbSpin .8s linear infinite}
    #lbMapRetry{border:1px solid rgba(49,231,242,.45);border-radius:8px;background:#0b2635;color:#fff;padding:6px 9px;font:800 12px Rajdhani,system-ui,sans-serif;cursor:pointer}
    #lbMapRetry[hidden]{display:none!important}
    @keyframes lbSpin{to{transform:rotate(360deg)}}
    @media(max-width:700px){#lbMapBack{top:7px;left:7px;min-height:34px;padding:6px 9px;font-size:11px}}
  </style>
</head>
<body>
<button id="lbMapBack" type="button" hidden aria-label="Retour à la carte">← Retour à la carte</button>
<div id="lbMapStatus" hidden role="status" aria-live="polite"><div class="lbMapStatusCard"><span class="lbMapSpinner" aria-hidden="true"></span><strong id="lbMapStatusText">Chargement…</strong><button id="lbMapRetry" type="button" hidden>Réessayer</button></div></div>
<iframe id="mapV2" class="lbViewFrame" src="https://vps.labetaillere.fr/map-v2/carte-preview.html?full=1&v=20260914-bus-icon-size-v3" title="Carte La Bétaillère" allow="geolocation"></iframe>
<script>
(()=>{
  'use strict';
  const back=document.getElementById('lbMapBack');
  const status=document.getElementById('lbMapStatus');
  const statusText=document.getElementById('lbMapStatusText');
  const retry=document.getElementById('lbMapRetry');
  const MAP_URL='https://vps.labetaillere.fr/map-v2/carte-preview.html?full=1&v=20260914-bus-icon-size-v3';
  const LUX_URL='https://vps.labetaillere.fr/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html';
  const VPS_ORIGIN='https://vps.labetaillere.fr';
  let mapFrame=document.getElementById('mapV2');
  let luxFrame=null;
  let luxReady=false;
  let view='map';
  let luxOpenSeq=0;
  let luxRetryCount=0;
  let luxRetryTimer=0;

  function setStatus(visible,text='Chargement…',showRetry=false){status.hidden=!visible;statusText.textContent=text;retry.hidden=!showRetry;}
  function clearLuxWatch(){if(luxRetryTimer)clearTimeout(luxRetryTimer);luxRetryTimer=0;}
  function freshLuxUrl(){const u=new URL(LUX_URL);u.searchParams.set('lbopen',`${Date.now()}-${++luxOpenSeq}`);return u.toString();}
  function sendLuxActive(active){try{luxFrame?.contentWindow?.postMessage({type:'lb:lux-active',active},VPS_ORIGIN);}catch(_){}}

  function ensureMap(){
    if(mapFrame?.isConnected)return mapFrame;
    const f=document.createElement('iframe');
    f.id='mapV2';f.className='lbViewFrame';f.title='Carte La Bétaillère';f.allow='geolocation';f.src=MAP_URL;
    document.body.appendChild(f);mapFrame=f;return f;
  }

  function createLux(force=false){
    if(luxFrame?.isConnected&&!force)return luxFrame;
    if(luxFrame?.isConnected)luxFrame.remove();
    luxReady=false;
    const f=document.createElement('iframe');
    f.id='luxV2';f.className='lbViewFrame';f.title='Gare dynamique de Luxembourg';f.allow='geolocation';f.src=freshLuxUrl();
    document.body.appendChild(f);luxFrame=f;return f;
  }

  function armLuxWatch(){
    clearLuxWatch();
    luxRetryTimer=setTimeout(()=>{
      if(view!=='lux'||luxReady)return;
      if(luxRetryCount<1){luxRetryCount++;setStatus(true,'Reconnexion à la gare…');createLux(true);armLuxWatch();return;}
      setStatus(true,'La gare met plus de temps que prévu.',true);
    },4000);
  }

  function showMap(){
    if(view==='map')return;
    view='map';clearLuxWatch();setStatus(false);back.hidden=true;
    if(luxFrame){sendLuxActive(false);luxFrame.hidden=true;}
    const m=ensureMap();m.hidden=false;
  }

  function showLuxDynamic(){
    if(view==='lux')return;
    view='lux';back.hidden=false;luxRetryCount=0;
    if(luxFrame?.isConnected&&luxReady){
      if(mapFrame)mapFrame.hidden=true;
      luxFrame.hidden=false;sendLuxActive(true);setStatus(false);return;
    }
    setStatus(true,'Chargement de la gare…');
    if(mapFrame)mapFrame.hidden=true;
    const f=createLux(false);f.hidden=false;armLuxWatch();
  }

  back.addEventListener('click',showMap);
  retry.addEventListener('click',()=>{if(view!=='lux')return;luxRetryCount=0;setStatus(true,'Rechargement de la gare…');createLux(true);armLuxWatch();});

  window.addEventListener('message',event=>{
    if(luxFrame&&event.source===luxFrame.contentWindow){
      if(event.data?.type==='lb:lux-ready'){
        luxReady=true;clearLuxWatch();
        if(view==='lux'){luxFrame.hidden=false;sendLuxActive(true);setStatus(false);if(mapFrame){mapFrame.remove();mapFrame=null;}}
        else{luxFrame.hidden=true;sendLuxActive(false);}
        return;
      }
      if(window.parent!==window)window.parent.postMessage(event.data,'*');
      return;
    }
    if(mapFrame&&event.source===mapFrame.contentWindow){
      if(event.data?.type==='lb:open-lux-dynamic'){showLuxDynamic();return;}
      if(window.parent!==window)window.parent.postMessage(event.data,'*');
      return;
    }
    if(window.parent!==window&&event.source===window.parent){
      const target=view==='lux'?luxFrame:mapFrame;
      target?.contentWindow?.postMessage(event.data,'*');
    }
  });
})();
</script>
</body>
</html>
