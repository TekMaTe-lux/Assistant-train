<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — LIVE</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611}
    #mapCore{display:block;width:100%;height:100%;border:0;background:#020611}
  </style>
</head>
<body>
<iframe id="mapCore" src="carte-core.html?lbEmbedded=1&v=20260817-route-selection" title="Carte La Bétaillère" allow="geolocation"></iframe>
<script>
(()=>{
  const frame=document.getElementById('mapCore');

  const THEME=`
    :root{
      --lb-bg:#020611;--lb-panel:rgba(2,10,24,.97);--lb-panel2:rgba(4,19,37,.95);
      --lb-cyan:#00eaff;--lb-blue:#168dff;--lb-violet:#745cff;--lb-green:#9cff00;
      --lb-red:#ff405c;--lb-orange:#ffad32;--lb-text:#edfaff;--lb-muted:#8ca8c5;
      --marker-font:10px!important;--marker-gap:2px!important;--marker-num-font:9.5px!important;
      --marker-num-pad:1px 4px!important;--marker-delay-font:8.5px!important;
      --station-font:11px!important;--station-pad:1px 2px!important;
    }
    html,body,#map{height:100%!important;min-height:100%!important}
    body{margin:0!important;overflow:hidden!important;background:#020611!important;color:var(--lb-text)!important;font-family:Rajdhani,Orbitron,system-ui,sans-serif!important}
    header{display:none!important} #map{top:0!important}

    .leaflet-container{background:#03101d!important}
    .leaflet-control-zoom,.leaflet-control-layers,.leaflet-bar{border:1px solid rgba(0,234,255,.3)!important;border-radius:9px!important;overflow:hidden!important;box-shadow:0 8px 22px rgba(0,0,0,.32)!important}
    .leaflet-control-zoom a,.leaflet-control-layers{background:rgba(2,10,23,.95)!important;color:#eaffff!important;border-color:rgba(0,234,255,.15)!important}
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:rgba(2,10,23,.98)!important;color:#eaffff!important}
    .leaflet-popup-content-wrapper{border:1px solid rgba(0,234,255,.32)!important;border-radius:11px!important}

    .panel{top:7px!important;width:min(900px,calc(100% - 16px))!important;padding:7px 9px!important;gap:6px!important;border-radius:11px!important;background:linear-gradient(135deg,rgba(2,9,22,.98),rgba(4,20,38,.95))!important;border:1px solid rgba(0,234,255,.34)!important;box-shadow:0 9px 28px rgba(0,0,0,.36)!important;backdrop-filter:blur(9px)!important}
    .badge{padding:3px 7px!important;border-radius:6px!important;background:rgba(4,19,36,.88)!important;border-color:rgba(0,234,255,.22)!important;box-shadow:none!important;color:#dffaff!important}

    .cow-marker{gap:2px!important;filter:none!important;text-shadow:none!important}
    .cow-marker .cow-glyph{font-size:9px!important;opacity:.85!important}
    .cow-marker .train-num{min-height:16px!important;display:inline-flex!important;align-items:center!important;padding:1px 4px!important;border-radius:4px!important;font-size:9.5px!important;font-weight:850!important;line-height:1!important;border-width:1px!important;box-shadow:0 2px 4px rgba(0,0,0,.25)!important}
    .cow-marker.train-sncf .train-num{background:rgba(2,27,52,.92)!important;border-color:rgba(0,199,255,.58)!important;color:#dff8ff!important}
    .cow-marker.train-cfl .train-num{background:rgba(66,8,37,.92)!important;border-color:rgba(255,64,130,.58)!important;color:#ffe8f1!important}
    .cow-marker.train-tgv-roi .train-num{background:rgba(58,40,4,.93)!important;border-color:rgba(255,211,83,.56)!important;color:#fff2b5!important}
    .cow-marker .train-delay-badge{min-height:15px!important;margin-left:0!important;padding:1px 4px!important;border-radius:4px!important;font-size:8.5px!important;font-weight:900!important;line-height:1!important;box-shadow:none!important}

    .station-marker{min-width:19px!important;min-height:19px!important;padding:1px 2px!important;border-radius:5px!important;font-size:10px!important}
    .station-marker.station-major{color:#dffb74!important;border-color:rgba(156,255,0,.35)!important;background:rgba(38,66,0,.14)!important}
    .station-marker.station-regular{color:#b9f8ff!important;border-color:rgba(0,234,255,.22)!important;background:rgba(0,234,255,.07)!important}

    .trip-panel{top:8px!important;right:8px!important;width:min(440px,calc(100vw - 16px))!important;max-height:calc(100vh - 16px)!important;padding:10px!important;gap:8px!important;border-radius:14px!important;background:linear-gradient(150deg,rgba(2,9,22,.985),rgba(4,19,37,.97))!important;border:1px solid rgba(0,234,255,.4)!important;box-shadow:0 16px 40px rgba(0,0,0,.45)!important;backdrop-filter:blur(11px)!important;box-sizing:border-box!important}
    .trip-panel-header{padding:2px 2px 7px!important;border-bottom:1px solid rgba(0,234,255,.18)!important;min-width:0!important}
    .station-board-now,.trip-panel-title{font-weight:850!important;color:#f2fdff!important;min-width:0!important}
    .trip-panel-close{width:29px!important;height:29px!important;flex:0 0 29px!important;background:rgba(3,21,39,.92)!important;border:1px solid rgba(0,234,255,.28)!important;color:#eefcff!important}
    .trip-panel-back{border-radius:7px!important;border-color:rgba(0,234,255,.25)!important;background:rgba(3,21,39,.88)!important;color:#e8fbff!important}

    .lb-station-tabs{display:flex!important;width:max-content!important;gap:4px!important;padding:3px!important;margin:1px 0 4px!important;border-radius:12px!important;background:rgba(6,24,37,.9)!important;border:1px solid rgba(76,226,241,.2)!important;box-shadow:none!important}
    .lb-station-tab{appearance:none!important;min-height:30px!important;padding:5px 13px!important;border:1px solid transparent!important;border-radius:9px!important;background:transparent!important;color:#7d9da8!important;font:850 11px/1 Rajdhani,system-ui,sans-serif!important;cursor:pointer!important;box-shadow:none!important;transition:color 150ms ease,background 150ms ease,border-color 150ms ease!important}
    .lb-station-tab:hover{color:#bdd8df!important;background:rgba(49,231,242,.055)!important}
    .lb-station-tab.is-active{color:#effcff!important;border-color:rgba(49,231,242,.38)!important;background:linear-gradient(180deg,rgba(29,182,209,.22),rgba(14,111,153,.16))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 20px rgba(0,211,229,.12)!important}
    .lb-station-tab:focus-visible{outline:2px solid #31e7f2!important;outline-offset:2px!important;box-shadow:0 0 0 3px rgba(49,231,242,.2)!important}
    .trip-panel:not(.station-board-mode) .lb-station-tabs{display:none!important}

    [data-lb-board]{min-width:0!important;width:100%!important;max-width:none!important}
    .lb-board-host{display:grid!important;grid-template-columns:1fr!important;width:100%!important;gap:0!important;min-width:0!important}
    .lb-force-hidden{display:none!important}

    .station-board table{width:100%!important;border-collapse:separate!important;border-spacing:0 2px!important}
    .station-board th{padding:0 5px 3px!important;font-size:9px!important;letter-spacing:.08em!important;color:#63dff5!important}
    .station-board tbody tr:nth-child(odd) td{background:linear-gradient(90deg,rgba(4,16,30,.96),rgba(5,20,36,.93))!important}
    .station-board tbody tr:nth-child(even) td{background:linear-gradient(90deg,rgba(9,31,46,.96),rgba(7,26,42,.94))!important}
    .station-board tbody tr td{padding:5px 6px!important;border-top:1px solid rgba(49,231,242,.08)!important;border-bottom:1px solid rgba(49,231,242,.08)!important;transition:background 120ms ease,border-color 120ms ease!important}
    .station-board tbody tr:hover td{background:linear-gradient(90deg,rgba(14,53,70,.98),rgba(8,35,53,.96))!important;border-color:rgba(49,231,242,.22)!important}
    .station-board tbody tr td:first-child{border-left:2px solid rgba(49,231,242,.16)!important}
    .station-board tbody tr:nth-child(even) td:first-child{border-left-color:rgba(49,231,242,.34)!important}
    .station-board button,.station-board .detail-btn,.station-board .details-btn{min-height:25px!important;padding:3px 6px!important;border-radius:6px!important;font-size:9px!important;background:rgba(3,24,44,.92)!important;border:1px solid rgba(0,234,255,.22)!important;color:#e9fbff!important}

    @keyframes lb-status-blink{0%,100%{opacity:1}50%{opacity:.30}}
    .station-board-row-imminent td{animation:station-board-blink .9s ease-in-out infinite!important}
    .station-board-row-cancelled .station-board-time-sub.is-cancelled{animation:lb-status-blink 1.05s ease-in-out infinite!important;color:#ff4e5c!important;font-weight:900!important}

    .station-board-time--delayed .station-board-time-planned{
      color:#7d8792!important;
      opacity:.72!important;
      text-decoration:line-through!important;
      text-decoration-color:#8b96a0!important;
      text-decoration-thickness:1.5px!important;
    }
    .station-board-time--delayed .station-board-time-delayed,
    .station-board-time-sub.lb-delay-blink{
      color:#ffad32!important;
      font-weight:900!important;
      animation:lb-status-blink 1.05s ease-in-out infinite!important;
    }
    .station-board tbody tr.lb-row-delayed td{border-top-color:rgba(255,173,50,.18)!important;border-bottom-color:rgba(255,173,50,.18)!important}
    .station-board tbody tr.lb-row-delayed td:first-child{border-left-color:rgba(255,173,50,.72)!important}

    @media(max-width:720px){
      :root{--marker-font:8.5px!important;--marker-gap:1px!important;--marker-num-font:8px!important;--marker-num-pad:1px 3px!important;--marker-delay-font:7.5px!important;--station-font:9px!important}
      .panel{top:5px!important;width:calc(100% - 10px)!important;padding:5px 6px!important;border-radius:9px!important;gap:4px!important}.panel .badge,.panel .muted{font-size:9px!important}.ctrl input[type=range]{width:92px!important}
      .cow-marker .cow-glyph{font-size:8px!important}.cow-marker .train-num{min-height:14px!important;padding:1px 3px!important;font-size:8px!important}.cow-marker .train-delay-badge{min-height:13px!important;padding:1px 3px!important;font-size:7.5px!important}
      .trip-panel{top:auto!important;right:auto!important;bottom:5px!important;left:5px!important;width:calc(100vw - 10px)!important;max-width:none!important;min-width:0!important;max-height:min(72vh,600px)!important;padding:8px!important;border-radius:13px!important;margin:0!important;transform:none!important}
      .trip-panel-header{position:sticky!important;top:0!important;z-index:6!important;background:rgba(2,9,22,.98)!important}
      .lb-station-tabs{width:100%!important;box-sizing:border-box!important}.lb-station-tab{flex:1!important;min-height:31px!important;font-size:10px!important}
      .trip-panel-body,.trip-stops,.station-board,.station-board-grid,.station-board-block,.station-board-table-wrap{min-width:0!important;width:100%!important;max-width:100%!important;box-sizing:border-box!important;overflow-x:hidden!important}
      .station-board-grid{grid-template-columns:minmax(0,1fr)!important}
      .station-board-table{width:100%!important;max-width:100%!important;table-layout:fixed!important}
      .station-board table{font-size:10px!important;border-spacing:0 2px!important}.station-board th{font-size:8px!important}.station-board tbody tr td{padding:5px!important}
    }

    /*
      Sur iPhone/PWA la carte est elle-même embarquée dans index.html. Selon Safari,
      le viewport CSS du sous-iframe peut rester plus large que l'espace réellement visible.
      Cette classe est pilotée par la largeur du conteneur extérieur et force alors la modale
      à occuper toute la largeur du viewport interne au lieu de rester bloquée à 440px.
    */
    html.lb-mobile-shell .trip-panel{
      top:auto!important;
      left:6px!important;
      right:auto!important;
      bottom:6px!important;
      width:calc(100vw - 12px)!important;
      max-width:none!important;
      min-width:0!important;
      max-height:min(72vh,600px)!important;
      box-sizing:border-box!important;
      margin:0!important;
      transform:none!important;
    }
    html.lb-mobile-shell .trip-panel.station-board-mode{width:calc(100vw - 12px)!important;max-width:none!important}
    html.lb-mobile-shell .trip-panel-body,
    html.lb-mobile-shell .trip-stops,
    html.lb-mobile-shell .station-board,
    html.lb-mobile-shell .station-board-grid,
    html.lb-mobile-shell .station-board-block,
    html.lb-mobile-shell .station-board-table-wrap{
      width:100%!important;
      max-width:100%!important;
      min-width:0!important;
      box-sizing:border-box!important;
      overflow-x:hidden!important;
    }
    html.lb-mobile-shell .station-board-grid{grid-template-columns:minmax(0,1fr)!important}
    html.lb-mobile-shell .station-board-table{width:100%!important;max-width:100%!important;table-layout:fixed!important}
    html.lb-mobile-shell .trip-panel-title,
    html.lb-mobile-shell .station-board-now{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}

    @media(max-width:420px){.cow-marker .cow-glyph{display:none!important}.station-marker{min-width:17px!important;min-height:17px!important;font-size:9px!important}.trip-panel{max-height:76vh!important}}
    @media(prefers-reduced-motion:reduce){.panel,.trip-panel,.cow-marker,.station-marker,.lb-station-tab{transition:none!important}}
  `;

  function norm(s){return (s||'').replace(/\s+/g,' ').trim().toUpperCase()}
  function isStationPanel(panel){return !!panel && panel.classList.contains('station-board-mode')}
  function findLabel(panel,re){
    const all=[...panel.querySelectorAll('h1,h2,h3,h4,h5,h6,strong,span,div')];
    return all.find(el=>re.test(norm(el.textContent)) && norm(el.textContent).length<18) || null;
  }
  function findBoard(label){
    if(!label) return null;
    let node=label;
    for(let i=0;i<8 && node;i++,node=node.parentElement){
      if(!node.parentElement) break;
      const tables=node.querySelectorAll?.('table').length||0;
      const more=[...node.querySelectorAll?.('button')||[]].some(b=>/PLUS DE TRAINS/i.test(b.textContent||''));
      if(tables===1 || (more && node.children.length>1)) return node;
    }
    return null;
  }
  function setBoardVisible(board,visible){
    if(!board) return;
    if(visible){
      board.classList.remove('lb-force-hidden');
      board.style.removeProperty('display');
      board.removeAttribute('aria-hidden');
    }else{
      board.classList.add('lb-force-hidden');
      board.style.setProperty('display','none','important');
      board.setAttribute('aria-hidden','true');
    }
  }
  function cleanupNonStationPanel(panel){
    panel.querySelectorAll('.lb-station-tabs').forEach(x=>x.remove());
    panel.querySelectorAll('[data-lb-board]').forEach(b=>{
      b.classList.remove('lb-force-hidden');
      b.style.removeProperty('display');
      b.removeAttribute('aria-hidden');
      b.removeAttribute('data-lb-board');
    });
    panel.querySelectorAll('.lb-board-host').forEach(el=>el.classList.remove('lb-board-host'));
    panel.querySelectorAll('.lb-delay-blink').forEach(el=>el.classList.remove('lb-delay-blink'));
    panel.querySelectorAll('.lb-row-delayed').forEach(el=>el.classList.remove('lb-row-delayed'));
    delete panel.dataset.lbSelectedBoard;
  }
  function markDelayStatuses(panel){
    panel.querySelectorAll('.lb-delay-blink').forEach(el=>el.classList.remove('lb-delay-blink'));
    panel.querySelectorAll('.lb-row-delayed').forEach(el=>el.classList.remove('lb-row-delayed'));
    panel.querySelectorAll('.station-board tbody tr').forEach(row=>{
      if(row.classList.contains('station-board-row-cancelled')) return;
      const status=row.querySelector('.station-board-time-sub');
      if(!status) return;
      const text=norm(status.textContent);
      if(/RETARD|\+\s*\d+\s*MIN/.test(text)){
        status.classList.add('lb-delay-blink');
        row.classList.add('lb-row-delayed');
      }
    });
  }

  function syncResponsiveMode(doc){
    if(!doc?.documentElement) return;
    const shellWidth=Math.min(
      window.innerWidth||99999,
      window.visualViewport?.width||99999,
      frame.getBoundingClientRect().width||99999
    );
    doc.documentElement.classList.toggle('lb-mobile-shell',shellWidth<=760);
  }

  let applying=false;
  function enhance(doc){
    if(applying) return;
    applying=true;
    try{
      syncResponsiveMode(doc);
      const panels=[...doc.querySelectorAll('.trip-panel:not(.hidden)')];
      panels.forEach(panel=>{
        if(!isStationPanel(panel)){
          cleanupNonStationPanel(panel);
          return;
        }

        const depLabel=findLabel(panel,/^D[ÉE]PARTS?$/);
        const arrLabel=findLabel(panel,/^ARRIV[ÉE]ES?$/);
        const dep=findBoard(depLabel), arr=findBoard(arrLabel);
        if(!dep || !arr || dep===arr) return;

        dep.dataset.lbBoard='departures';
        arr.dataset.lbBoard='arrivals';
        const host=dep.parentElement===arr.parentElement ? dep.parentElement : null;
        if(host) host.classList.add('lb-board-host');

        let tabs=panel.querySelector('.lb-station-tabs');
        if(!tabs){
          tabs=doc.createElement('div');
          tabs.className='lb-station-tabs';
          tabs.innerHTML='<button type="button" class="lb-station-tab is-active" data-lb-tab="departures">Départs</button><button type="button" class="lb-station-tab" data-lb-tab="arrivals">Arrivées</button>';
          const body=panel.querySelector('.trip-panel-body')||panel;
          body.insertBefore(tabs,body.firstChild);
          tabs.addEventListener('click',e=>{
            const btn=e.target.closest('[data-lb-tab]');
            if(!btn) return;
            panel.dataset.lbSelectedBoard=btn.dataset.lbTab;
            enhance(doc);
          });
        }

        const selected=panel.dataset.lbSelectedBoard||'departures';
        setBoardVisible(dep,selected==='departures');
        setBoardVisible(arr,selected==='arrivals');
        tabs.querySelectorAll('[data-lb-tab]').forEach(b=>b.classList.toggle('is-active',b.dataset.lbTab===selected));
        markDelayStatuses(panel);
      });
    }finally{applying=false}
  }

  function install(){
    try{
      const doc=frame.contentDocument;
      if(!doc?.head||!doc.body) return;
      if(!doc.getElementById('lb-v2-fixed-theme')){
        const style=doc.createElement('style');
        style.id='lb-v2-fixed-theme';style.textContent=THEME;doc.head.appendChild(style);
      }
      syncResponsiveMode(doc);
      enhance(doc);
      if(!doc.__lbV2FixedObserver){
        let queued=false;
        const scheduleEnhance=()=>{
          if(queued) return;
          queued=true;
          requestAnimationFrame(()=>{queued=false;enhance(doc)});
        };
        const obs=new MutationObserver(scheduleEnhance);
        obs.observe(doc.body,{childList:true,subtree:true});
        doc.__lbV2FixedObserver=obs;

        const tripPanel=doc.querySelector('.trip-panel');
        if(tripPanel){
          const modeObs=new MutationObserver(scheduleEnhance);
          modeObs.observe(tripPanel,{attributes:true,attributeFilter:['class']});
          doc.__lbV2ModeObserver=modeObs;
        }
      }
    }catch(e){console.warn('[Carte production]',e)}
  }

  frame.addEventListener('load',()=>{install();setTimeout(install,150);setTimeout(install,700)});
  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow){if(window.parent!==window) window.parent.postMessage(event.data,'*')}
    else if(window.parent!==window&&event.source===window.parent){frame.contentWindow?.postMessage(event.data,'*')}
  });
  const resize=()=>{
    try{
      const doc=frame.contentDocument;
      syncResponsiveMode(doc);
      enhance(doc);
      frame.contentWindow?.dispatchEvent(new Event('resize'));
      frame.contentWindow?.map?.invalidateSize?.(false);
    }catch(_){ }
  };
  window.addEventListener('resize',resize,{passive:true});
  window.visualViewport?.addEventListener('resize',resize,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});
})();
</script>
</body>
</html>
