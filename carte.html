<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — LIVE</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611}
    #mapV2{display:block;width:100%;height:100%;border:0;background:#020611}
  </style>
</head>
<body>
<iframe
  id="mapV2"
  src="https://vps.labetaillere.fr/map-v2/carte-preview.html?v=20260817-recovery-v1"
  title="Carte La Bétaillère"
  allow="geolocation"
></iframe>
<script>
(()=>{
  const frame=document.getElementById('mapV2');

  // Pont entre la carte V2 hébergée sur le VPS et la page qui embarque carte.html
  // (notamment index.html pour l'ouverture des fiches train et le responsive mobile).
  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow){
      if(window.parent!==window) window.parent.postMessage(event.data,'*');
      return;
    }
    if(window.parent!==window && event.source===window.parent){
      frame.contentWindow?.postMessage(event.data,'*');
    }
  });
})();
</script>
</body>
</html>
