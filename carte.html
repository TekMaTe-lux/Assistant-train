<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Carte La Bétaillère — LIVE</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020611}
    #mapV2{display:block;width:100%;height:100%;border:0;background:#020611}
    #lbMapBack{
      position:fixed;z-index:20;top:10px;left:10px;display:inline-flex;align-items:center;gap:7px;
      min-height:36px;padding:7px 11px;border:1px solid rgba(49,231,242,.42);border-radius:10px;
      background:rgba(3,16,25,.94);color:#effcff;font:800 12px/1.1 Rajdhani,system-ui,sans-serif;
      box-shadow:0 8px 24px rgba(0,0,0,.32);cursor:pointer
    }
    #lbMapBack[hidden]{display:none!important}
    #lbMapBack:hover,#lbMapBack:focus-visible{border-color:#31e7f2;outline:2px solid rgba(49,231,242,.22);outline-offset:2px}
    @media(max-width:700px){#lbMapBack{top:7px;left:7px;min-height:34px;padding:6px 9px;font-size:11px}}
  </style>
</head>
<body>
<button id="lbMapBack" type="button" hidden aria-label="Retour à la carte">← Retour à la carte</button>
<iframe id="mapV2" title="Carte La Bétaillère" allow="geolocation"></iframe>
<script>
(()=>{
  const frame=document.getElementById('mapV2');
  const back=document.getElementById('lbMapBack');
  const FULL_MAP_URL='https://vps.labetaillere.fr/map-v2/carte-preview.html?v=20260905-community-traveler-v1';
  const MOBILE_MAP_URL='./carte-mobile-readonly.html?v=20260906-mobile-readonly-v1';
  const LUX_URL='https://vps.labetaillere.fr/map-v2/tests/luxembourg-user-preview-v5-private-maplike-trainclick.html';
  const MOBILE=window.matchMedia('(max-width: 920px)').matches && window.matchMedia('(pointer: coarse)').matches;
  let mapUrl=MOBILE?MOBILE_MAP_URL:FULL_MAP_URL;
  let view='map';
  let mobileReady=!MOBILE;
  let mobileFallbackTimer=null;

  function armMobileFallback(){
    if(!MOBILE||mobileReady)return;
    clearTimeout(mobileFallbackTimer);
    mobileFallbackTimer=setTimeout(()=>{
      if(mobileReady||view!=='map')return;
      mapUrl=FULL_MAP_URL;
      frame.title='Carte La Bétaillère — mode complet de secours';
      frame.src=FULL_MAP_URL;
    },9000);
  }

  function showMap(){
    if(view==='map') return;
    view='map';
    back.hidden=true;
    frame.title=MOBILE?'Carte La Bétaillère — lecture mobile':'Carte La Bétaillère';
    frame.src=mapUrl;
    armMobileFallback();
  }

  function showLuxDynamic(){
    if(MOBILE||view==='lux') return;
    view='lux';
    back.hidden=false;
    frame.title='Gare dynamique de Luxembourg';
    frame.src=LUX_URL;
  }

  back.addEventListener('click',showMap);
  frame.title=MOBILE?'Carte La Bétaillère — lecture mobile':'Carte La Bétaillère';
  frame.src=mapUrl;
  armMobileFallback();

  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow){
      if(MOBILE&&event.data?.type==='lb:mobile-map-ready'){
        mobileReady=true;
        clearTimeout(mobileFallbackTimer);
        return;
      }
      if(event.data?.type==='lb:open-lux-dynamic'){
        showLuxDynamic();
        return;
      }
      if(window.parent!==window) window.parent.postMessage(event.data,'*');
      return;
    }
    if(window.parent!==window && event.source===window.parent){
      frame.contentWindow?.postMessage(event.data,'*');
    }
  });
})();
</script>
</body>
</html>
